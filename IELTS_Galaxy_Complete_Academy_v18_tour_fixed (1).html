<title>IELTS Galaxy · Complete IELTS Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;650;750&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* Layout concept: exam-booklet sidebar + working canvas. Red-pen correction marks (strike red, insert green) are the one signature motif; a band-score ruler is the hero. */
:root{
  --font-display:'Geologica','Onest',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-read:'Source Serif 4',Georgia,'Times New Roman',serif;
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E8ECF4; --ink:#0D1421; --muted:#566178; --line:#D6DCE8;
  --accent:#2646EE; --accent-ink:#FFFFFF; --accent-soft:#E1E7FF;
  --good:#0A8554; --good-soft:#D8F2E5; --bad:#CF2038; --bad-soft:#FBE3E7; --warn:#935C00; --warn-soft:#FFEFCB;
  --s1:#2646EE; --s2:#DC5F22; --s3:#0A8554; --s4:#8B3CCF; --s5:#BF9000;
  --shadow:0 1px 2px rgba(13,20,33,.06),0 10px 28px -14px rgba(13,20,33,.22);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090D15; --surface:#111826; --surface-2:#192236; --ink:#E9EDF6; --muted:#98A4BB; --line:#25304A;
    --accent:#7A92FF; --accent-ink:#0A1030; --accent-soft:#1B2552;
    --good:#41DC9B; --good-soft:#0E2D23; --bad:#FF7285; --bad-soft:#3A1520; --warn:#F4B84A; --warn-soft:#352A10;
    --s1:#7A92FF; --s2:#FF8D52; --s3:#41DC9B; --s4:#C58BFF; --s5:#F0C23C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090D15; --surface:#111826; --surface-2:#192236; --ink:#E9EDF6; --muted:#98A4BB; --line:#25304A;
  --accent:#7A92FF; --accent-ink:#0A1030; --accent-soft:#1B2552;
  --good:#41DC9B; --good-soft:#0E2D23; --bad:#FF7285; --bad-soft:#3A1520; --warn:#F4B84A; --warn-soft:#352A10;
  --s1:#7A92FF; --s2:#FF8D52; --s3:#41DC9B; --s4:#C58BFF; --s5:#F0C23C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:12px}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 15px var(--font-mono);font-style:normal}
.brand small{display:block;font:500 11px var(--font-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;width:100%}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px 10px 0;border-top:1px solid var(--line)}
.main{min-width:0;padding-block:34px 90px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
.page-head{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.eyebrow{font:600 11.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.h1{font-size:clamp(28px,4.2vw,44px);font-weight:750}
.h2{font-size:21px;font-weight:700}
.h3{font-size:16px;font-weight:650}
.lead{font-size:16.5px;color:var(--muted);max-width:66ch}
.sec{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* cards + grid */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.raise{box-shadow:var(--shadow)}
.card.soft{background:var(--surface-2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* buttons / chips */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;background:var(--surface-2);color:var(--ink);border:1px solid transparent;transition:transform .12s,background .12s}
.btn:hover{background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:550;color:var(--muted);background:var(--surface)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font:600 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tag.tr{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.tag.cc{background:color-mix(in srgb,var(--s2) 16%,transparent);color:var(--s2)}
.tag.lr{background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3)}
.tag.rd{background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3)}.tag.ls{background:color-mix(in srgb,var(--s2) 16%,transparent);color:var(--s2)}.tag.sp{background:color-mix(in srgb,var(--s5) 18%,transparent);color:var(--s5)}.lxh{margin:18px 0 4px;font:700 22px var(--font-display);color:var(--accent)}.vav{position:absolute;right:1.5cqw;bottom:0;width:23cqw;pointer-events:none;filter:drop-shadow(0 1cqw 2cqw rgba(0,0,0,.45))}.vav svg{display:block;width:100%;animation:vbob 4.5s ease-in-out infinite}
@keyframes vbob{50%{transform:translateY(-1.2%) rotate(.6deg)}}
.vav #vmo{transform-box:fill-box;transform-origin:center;transition:transform .09s}.vav .eyes{transform-box:fill-box;transform-origin:center;transition:transform .08s}.vav.blink .eyes{transform:scaleY(.08)}
.vav .arm{transform-box:fill-box;transform-origin:50% 0}.vav.talk .arm.r{animation:vgr 1.3s ease-in-out infinite alternate}.vav.talk .arm.l{animation:vgl 1.7s ease-in-out infinite alternate}
@keyframes vgr{to{transform:rotate(-22deg) translateY(-3%)}}@keyframes vgl{to{transform:rotate(12deg)}}
.vst{padding-right:28cqw!important}.vsub{right:28cqw!important}
.vsel{max-width:150px}.vhint{font-size:12px;color:var(--muted);margin-top:6px}.btn.sm:disabled{opacity:.5}
.tag.gra{background:color-mix(in srgb,var(--s4) 16%,transparent);color:var(--s4)}
.tag.t1{background:color-mix(in srgb,var(--s5) 20%,transparent);color:var(--warn)}
.tag.gen{background:var(--surface-2);color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);overflow-x:auto;max-width:100%}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:2px 0 0}

/* bars + kpi */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.good>i{background:var(--good)}.bar.warn>i{background:var(--s5)}.bar.bad>i{background:var(--bad)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}

/* hero + band ruler */
.hero{position:relative;padding:28px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:760;max-width:15ch}
.ruler{position:relative;margin:34px 6px 8px;height:64px}
.ruler .track{position:absolute;left:0;right:0;top:30px;height:6px;border-radius:99px;background:var(--surface-2)}
.ruler .fill{position:absolute;left:0;top:30px;height:6px;border-radius:99px;background:var(--accent)}
.ruler .tick{position:absolute;top:24px;width:1px;height:18px;background:var(--line)}
.ruler .tick span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font:500 11px var(--font-mono);color:var(--muted)}
.ruler .pin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font:700 12px var(--font-mono)}
.ruler .pin b{padding:2px 7px;border-radius:6px;background:var(--ink);color:var(--bg)}
.ruler .pin.t b{background:var(--accent);color:var(--accent-ink)}
.ruler .pin::after{content:"";width:2px;height:20px;background:currentColor}
.ruler .pin.t{color:var(--accent)}
.ruler .pin.n{color:var(--ink)}

/* tables */
.tw{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* lessons */
.lessons{display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;align-items:start}
.lnav{position:sticky;top:20px;display:flex;flex-direction:column;gap:4px}
.lnav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:550;color:var(--muted)}
.lnav button:hover{background:var(--surface-2)}
.lnav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.lnav button:focus-visible{outline:2px solid var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.done{background:var(--good);border-color:var(--good)}
.prose{display:flex;flex-direction:column;gap:14px;max-width:72ch}
.prose h3{font-size:19px;margin-top:14px;font-weight:700}
.prose h4{font-size:15px;margin-top:6px}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prose code,.k{font-family:var(--font-mono);font-size:.9em;padding:1px 6px;border-radius:5px;background:var(--surface-2)}
.callout{padding:14px 16px;border-radius:12px;background:var(--accent-soft);color:var(--ink);border-left:3px solid var(--accent)}
.callout.warn{background:var(--warn-soft);border-color:var(--s5)}
.callout.good{background:var(--good-soft);border-color:var(--good)}
.callout b:first-child{display:block;font:600 11.5px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;color:var(--accent)}
.callout.warn b:first-child{color:var(--warn)}.callout.good b:first-child{color:var(--good)}
.fix{display:grid;gap:7px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:15px}
.fix>div{display:flex;gap:10px;align-items:baseline}
.fix .lbl{flex:none;width:52px;font:600 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.fix .lbl.b{color:var(--bad)}.fix .lbl.g{color:var(--good)}
.fix .x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.6px}
.fix .v{color:var(--good);font-weight:550}
.fix .note{font-size:13px;color:var(--muted);margin-left:62px}
.ex{font-family:var(--font-read);font-size:16.5px;padding:9px 14px;border-left:3px solid var(--line);color:var(--ink)}
.cta{display:flex;gap:10px;flex-wrap:wrap;padding-top:8px}

/* quiz */
.cat{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;min-width:0}
.cat:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.cat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cat{transition:transform .15s,box-shadow .15s,border-color .15s}
.qwrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.qbox{padding:26px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.qtext{font:500 21px/1.4 var(--font-read);margin:10px 0 4px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;background:var(--surface);font-family:var(--font-read);font-size:17px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt kbd{flex:none;font:600 11px var(--font-mono);width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-top:2px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.lock{pointer-events:none}
.why{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--surface-2);font-size:14.5px}
.why.ok{background:var(--good-soft)}.why.no{background:var(--bad-soft)}
.why b{display:block;font:600 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.why.ok b{color:var(--good)}.why.no b{color:var(--bad)}
.score{font:750 64px/1 var(--font-display);letter-spacing:-.03em}

/* timer + writer */
.write{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.prompt{padding:22px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.prompt p.q{font:500 20px/1.5 var(--font-read);margin-top:10px}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer .t{font:600 34px var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:4.2ch}
.phases{display:flex;gap:3px;height:8px;margin-top:10px}
.phases i{display:block;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.phases i b{position:absolute;inset:0;width:0;background:var(--accent);border-radius:99px}
.phlabels{display:flex;gap:3px;margin-top:4px;font:500 10.5px var(--font-mono);color:var(--muted);letter-spacing:.03em}
.phlabels span.on{color:var(--accent);font-weight:700}
.ta{width:100%;min-height:440px;resize:vertical;padding:18px 20px;border-radius:14px;font:17px/1.7em var(--font-read);background-color:var(--surface);background-image:linear-gradient(transparent calc(1.7em - 1px),var(--line) 1px);background-size:100% 1.7em;background-attachment:local;background-position:0 17px;border:1px solid var(--line)}
.wc{display:inline-flex;gap:8px;align-items:baseline;padding:6px 12px;border-radius:99px;font:600 13px var(--font-mono);background:var(--surface-2)}
.wc b{font-size:19px}
.wc.low{background:var(--bad-soft);color:var(--bad)}.wc.mid{background:var(--warn-soft);color:var(--warn)}.wc.ok{background:var(--good-soft);color:var(--good)}
.panel{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.mrow:last-child{border:0}
.mrow .v{font:600 13px var(--font-mono)}
.mrow .v.ok{color:var(--good)}.mrow .v.low{color:var(--warn)}.mrow .v.bad{color:var(--bad)}
.issue{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:9px;background:var(--bad-soft);font-size:13px;border-left:3px solid var(--bad)}
.issue.w{background:var(--warn-soft);border-color:var(--s5)}
.issue q{font-family:var(--font-read);font-size:14px;quotes:"«" "»"}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer}
.sel4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* vocab */
.vcard{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.vcard b{font:650 16px var(--font-display)}
.vcard.known{opacity:.55}
.flash{perspective:1000px;max-width:520px;margin:0 auto;width:100%}
.flash .in{position:relative;min-height:240px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d;width:100%;all:unset;display:block;box-sizing:border-box}
.fcard{min-height:250px;border-radius:20px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;width:100%}
.fcard .big{font:700 28px var(--font-display);letter-spacing:-.02em;text-wrap:balance}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 12px var(--font-mono)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--muted);stroke-width:1}
.chart .lbl{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:550}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c1{--c:var(--s1)}.c2{--c:var(--s2)}.c3{--c:var(--s3)}.c4{--c:var(--s4)}.c5{--c:var(--s5)}
.legend i,.sw{background:var(--c)}

/* models: structure highlights */
.essay{font:18px/1.75 var(--font-read);display:flex;flex-direction:column;gap:18px;max-width:70ch}
.essay .pl{display:block;font:600 11px var(--font-mono);letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.essay mark{background:transparent;color:inherit;border-radius:3px;padding:0 1px;transition:background .2s}
.on-conc mark[data-t="conc"]{background:color-mix(in srgb,var(--s1) 22%,transparent);box-shadow:0 2px 0 var(--s1)}
.on-rel mark[data-t="rel"]{background:color-mix(in srgb,var(--s3) 22%,transparent);box-shadow:0 2px 0 var(--s3)}
.on-cond mark[data-t="cond"]{background:color-mix(in srgb,var(--s2) 22%,transparent);box-shadow:0 2px 0 var(--s2)}
.on-pass mark[data-t="pass"]{background:color-mix(in srgb,var(--s4) 22%,transparent);box-shadow:0 2px 0 var(--s4)}
.on-part mark[data-t="part"]{background:color-mix(in srgb,var(--s5) 28%,transparent);box-shadow:0 2px 0 var(--s5)}
.on-link mark[data-t="link"]{background:color-mix(in srgb,var(--muted) 20%,transparent);box-shadow:0 2px 0 var(--muted)}
.on-hedge mark[data-t="hedge"]{background:color-mix(in srgb,var(--bad) 16%,transparent);box-shadow:0 2px 0 var(--bad)}
.hlchip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:550}
.hlchip i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.hlchip[aria-pressed="false"]{opacity:.45}
.hlchip:focus-visible{outline:2px solid var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;transition:.25s;z-index:80;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.acc summary{cursor:pointer;padding:13px 16px;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font:500 20px/1 var(--font-mono);color:var(--muted)}
.acc[open] summary::after{content:"−"}
.acc>div{padding:0 16px 16px}
.theme-btn{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:550;color:var(--muted);padding:6px 2px}
.theme-btn:hover{color:var(--ink)}
.theme-btn:focus-visible{outline:2px solid var(--accent);border-radius:6px}

/* responsive */

  .brand{padding:0;font-size:0;gap:0}.brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;flex:1;min-width:0;scrollbar-width:none}

  .main{padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .lessons{grid-template-columns:minmax(0,1fr)}
  .lnav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .lnav button{white-space:nowrap}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
}

{id:'g1',title:'Грамматика: частые ошибки',tag:'gra',min:15,cat:'frag',html:`
<p>Это ошибки, которые чаще всего тянут критерий GRA вниз. Исправление первых пяти даёт примерно +0.5 к GRA.</p>
<h3>1. Фрагмент вместо предложения</h3>
<p>В каждом предложении нужны подлежащее и сказуемое (глагол в личной форме). Слова <code>that, which, because, although</code> не заменяют глагол.</p>
${fx('The fact that a short vacation can preserve students’ time for more essential tasks.','The fact that a short vacation can preserve students’ time for more essential tasks is a strong argument for reform.','После «the fact that …» не было главного глагола.')}
${fx('The fact that a short vacation can preserve students’ time.','A short vacation can preserve students’ time.','Или проще: убрать «the fact that».')}
${co('good','Проверка','Найдите глагол, который «делает» главное действие. Если его нет, это фрагмент. Шаблон заключения, который трудно сломать: <code>Although [аргумент A], [аргумент B].</code>')}

<h3>2. Порядок слов в придаточных</h3>
<p>После <code>as, because, that, if, when, why, whether</code> порядок прямой: подлежащее, потом глагол. Вопросительный порядок только в вопросах.</p>
${fx('as for full recovery is enough','as one month is enough for full recovery')}
${fx('as much knowledge as it possible','as much knowledge as possible','или as it is possible')}

<h3>3. Исчисляемые и неисчисляемые существительные</h3>
<p>Неисчисляемые (без <code>a</code>, без <code>-s</code>): knowledge, information, advice, homework, research, progress, equipment, education и time в общем смысле.</p>
${fx('a new academic knowledge','new academic knowledge','или a new body of knowledge')}
${fx('many informations','a lot of information / a great deal of information')}
${fx('less holidays','fewer holidays','fewer + исчисляемое, less + неисчисляемое')}
${ex('less time, fewer weeks, less homework, fewer exams')}

<h3>4. Предлоги и устойчивые сочетания</h3>
<p>Учите глагол вместе с предлогом, а не по отдельности.</p>
${tb(['Неверно','Верно'],[['pay attention toward','pay attention <b>to</b>'],['spend time for themselves','spend time <b>on</b> hobbies / by themselves'],['recover after a year','recover <b>from</b> a year of study'],['benefit for students','benefit students / be beneficial <b>for</b> students'],['focus in subjects','focus <b>on</b> subjects'],['depends of','depends <b>on</b>'],['lead for','lead <b>to</b> + существительное']])}

<h3>5. Артикли</h3>
<ul>
<li>Общий смысл (множественное или неисчисляемое): <b>без артикля</b>. <i>Children need rest.</i></li>
<li>Конкретное, известное из контекста: <b>the</b>. <i>The children in my class…</i></li>
<li>Первое упоминание единичного предмета: <b>a / an</b>. <i>A child who spends a month abroad…</i></li>
<li>Уникальное: <b>the</b>. <i>the world, the Internet, the environment.</i></li>
</ul>

<h3>6. Согласование подлежащего и сказуемого</h3>
${ex('Academic information and practical skills <b>require</b> time. (два подлежащих → множественное число)')}
${ex('The number of students <b>is</b> growing. / A number of students <b>are</b> leaving.')}
${ex('Each of the students <b>has</b>… / One of the reasons <b>is</b>…')}

<h3>7. Запятые и пунктуация</h3>
<ul>
<li>После вводных слов: <i>Firstly, … However, … In addition, …</i></li>
<li>Перед союзом, соединяющим два полных предложения: <i>…, and / but / so …</i></li>
<li>Не ставьте запятую между подлежащим и сказуемым.</li>
<li>Каждое предложение заканчивается точкой.</li>
</ul>

<h3>8. Времена</h3>
<p>В эссе почти всё в Present Simple (общие утверждения), Present Perfect для связи с настоящим, будущее только для прогнозов. Не смешивайте времена внутри одного предложения без причины.</p>

{id:'g2',title:'Структуры для band 7',tag:'gra',min:14,cat:'struct',html:`
<p>Для 6.5–7.0 нужно показать разнообразие: простые, сложные и сложноподчинённые предложения, и большинство без ошибок. Не усложняйте ради красоты: одна точная структура лучше трёх сломанных.</p>
<h3>1. Уступка: although, while, whereas</h3>
${ex('<b>Although</b> long holidays allow children to rest, they may cause pupils to forget what they have learned.')}
${ex('<b>While</b> some parents value family travel, others believe that classroom time is more important.')}
${ex('Long holidays benefit relaxation, <b>whereas</b> shorter ones favour academic continuity.')}
${fx('Although it is useful, but it is costly.','Although it is useful, it is costly.','Although и but вместе не употребляются.')}
<h3>2. Причина и следствие</h3>
${ex('<b>Because</b> children are under constant pressure, they need time to recover.')}
${ex('Children are under constant pressure; <b>as a result</b>, many suffer from burnout.')}
${ex('…<b>so that</b> they can return to school motivated. (цель)')}
${ex('The break is <b>so</b> long <b>that</b> pupils forget key skills.')}
<h3>3. Определительные придаточные: who, which, that, where</h3>
${ex('Children <b>who</b> spend holidays travelling often become more open-minded.')}
${ex('Long summers, <b>which</b> can last up to three months, make it harder to maintain learning habits.')}
${ex('Many families choose countries <b>where</b> they can learn about history.')}
<p><code>which</code> с запятыми добавляет дополнительную информацию. <code>that</code> без запятых уточняет, о ком или о чём речь.</p>
<h3>4. Условные предложения</h3>
${tb(['Тип','Структура','Пример'],[['Zero','If + Present, Present','If children do not rest, they lose motivation.'],['First','If + Present, will + V','If holidays are shortened, pupils will have more time for science.'],['Second','If + Past, would + V','If holidays were shorter, teachers would cover more of the curriculum.']])}
<p>В эссе чаще используют Zero и Second для общих гипотез.</p>
<h3>5. Пассивный залог</h3>
<p>Хорош, когда важнее результат, чем тот, кто действует. Одного-двух пассивных предложений на эссе достаточно.</p>
${ex('Academic knowledge <b>is</b> often <b>lost</b> during long breaks.')}
${ex('More practical lessons <b>could be organised</b> if holidays were shortened.')}
<h3>6. Причастные обороты и герундий</h3>
${ex('<b>Spending</b> a month abroad, children gain cultural awareness.')}
${ex('<b>Having rested</b> for weeks, pupils return to school more focused.')}
${ex('<b>Studying</b> for exams requires concentration. / <b>Instead of attending</b> summer camps, some children prefer staying at home.')}
${fx('Spending a month abroad, the lessons are forgotten.','Spending a month abroad, children forget the lessons.','Подлежащее причастия должно совпадать с подлежащим главной части.')}
<h3>7. Модальные глаголы и осторожные утверждения (hedging)</h3>
<p>Экзаменатор ценит аккуратность: не пишите «всегда» и «все».</p>
${ex('can lead to… / may cause… / tend to reduce… / It is likely that… / It could be argued that…')}
${fx('All children get tired.','Many children become tired.')}
<h3>8. Инверсия (по желанию, band 7+)</h3>
${ex('<b>Not only do</b> long holidays help children rest, but they also encourage cultural learning.')}
${ex('<b>Rarely do</b> pupils retain knowledge after three months without lessons.')}
<p>Не больше одной такой структуры на эссе и только если вы уверены в порядке слов.</p>
${co('good','Ориентир для эссе на band 6.5–7.0 (не жёсткая норма)',`<ul><li>3–4 предложения с although / while / whereas</li><li>2–3 предложения с who / which / where</li><li>1 условное, 1 пассивное</li><li>1–2 причастных оборота или герундия</li><li>остальное — короткие точные простые предложения, они тоже нужны</li></ul>В разделе «Письмо» счётчик показывает, сколько таких структур уже есть в вашем тексте.`)}
`},

{id:'tr',title:'Task Response',tag:'tr',min:14,cat:'link',html:`
<p>Task Response отвечает на вопрос: сделали ли вы то, о чём просили, и насколько глубоко.</p>
<h3>Шаг 1. Определите тип вопроса</h3>
${tb(['Тип','Что делать','Позиция нужна?'],[['Discuss both views','Раскрыть обе точки зрения','Только если просят «give your opinion»'],['Opinion (agree / disagree)','Ясно выразить позицию во введении и заключении','Да'],['Advantages / disadvantages','Раскрыть оба аспекта и, если просят, сказать, что перевешивает','Зависит от формулировки'],['Problem / solution','Назвать проблемы (или причины) и предложить решения','Нет'],['Two-part question','Ответить на оба вопроса','Нет']])}
<p>Главная ошибка — ответить не на тот тип. Подчеркните ключевые слова задания, прежде чем писать.</p>
<h3>Шаг 2. Введение (2 предложения)</h3>
<ol><li>Перефразируйте тему, не копируйте.</li><li>Скажите, что обсудите (и свою позицию, если нужно).</li></ol>
${ex('Some people believe that school holidays should be shorter, while others argue that long breaks are essential for children. This essay will discuss both views.')}
<h3>Шаг 3. Основной абзац по схеме PEEL</h3>
<p><b>Point</b> (идея) → <b>Explanation</b> (почему) → <b>Example</b> (конкретный пример) → <b>Link</b> (вывод, связанный с вопросом).</p>
${co('warn','Слабый абзац',`Firstly, vacation has general benefits for children because after all tests and hard education year they can fully recover during this vacation. For example, they can play with their friends.<br><br><i>Проблемы: идея размыта, «For example» не добавляет нового, нет следствия.</i>`)}
${co('good','Сильный абзац (band 7)',`Long holidays give children the chance to recover from academic pressure. During the school year, pupils face constant exams and homework, which can lead to stress and exhaustion. If they cannot rest, their motivation falls, and they may even develop negative attitudes towards learning. For instance, a child who spends two months playing sport and meeting friends usually returns to school more energetic and focused. Therefore, extended breaks help protect both mental health and later academic results.<br><br><i>Что изменилось: одна ясная идея, причина (давление), следствие (потеря мотивации), конкретная картинка, вывод.</i>`)}
<h3>Шаг 4. Хороший пример</h3>
<ul>
<li><b>Конкретный:</b> кто, где, что получил. Не «they can visit places», а «a child who spends a month with relatives abroad».</li>
<li><b>Реалистичный:</b> для младшей школы не пишите «путешествуют по всему миру».</li>
<li><b>Нейтральный:</b> личный опыт допустим, но коротко и без имён.</li>
<li><b>Без выдуманных цифр.</b> Допустимы общие формулировки вроде «studies suggest that pupils may lose some learning over the summer». Не выдумывайте точные проценты и названия исследований.</li>
</ul>
<h3>Шаг 5. Один аргумент в абзаце или два?</h3>
<ul>
<li><b>Один аргумент:</b> 100–130 слов, полная цепочка PEEL. Надёжнее для band 7.</li>
<li><b>Два аргумента:</b> по 60–70 слов каждый, у обоих должна быть причина и пример.</li>
<li>Не называйте два аргумента в одном предложении («rest and travel»): разделяйте.</li>
</ul>
<h3>Шаг 6. Заключение (2–3 предложения)</h3>
<ol><li>Перефразированная суть обеих сторон.</li><li>Вывод (позиция, если она требуется, или баланс).</li></ol>
${ex('In conclusion, although long holidays allow children to rest and experience new cultures, shorter breaks may protect academic progress. A balanced calendar, with moderate breaks throughout the year, could combine both benefits.')}
<p>Не вводите новые идеи в заключении и не повторяйте слова из введения дословно.</p>
<h3>Типичные ошибки TR</h3>
<ul><li>Описание вместо аргумента: «Children can play with friends» без вывода о пользе.</li><li>Повторение одной идеи разными словами в одном абзаце.</li><li>Слишком общие утверждения: everyone, always, all children.</li><li>Меньше 250 слов: это штраф. Цель: 270–300 слов.</li><li>Неравномерное раскрытие сторон в эссе «обе точки зрения».</li></ul>
${co('','Нет идей?','В разделе «Письмо» есть «Генератор идей»: 8 углов зрения с наводящими вопросами и конструктор PEEL-абзаца.')}
`},

{id:'cc',title:'Coherence & Cohesion',tag:'cc',min:12,cat:'link',html:`
<p>Coherence — логика: идеи идут в понятном порядке. Cohesion — языковые средства связи: связки, местоимения, повторы через синонимы.</p>
<h3>1. Структура эссе (4 абзаца, 270–300 слов)</h3>
${tb(['Абзац','Слов','Содержание'],[['Введение','35–45','Перефраз темы + что обсудите (и позиция, если нужна)'],['Основной 1','100–120','Первая точка зрения по PEEL'],['Основной 2','100–120','Вторая точка зрения по PEEL'],['Заключение','35–45','Итог обеих сторон + вывод']])}
<h3>2. Topic sentence: первое предложение абзаца</h3>
<p>Читатель должен понять суть абзаца по первой строке.</p>
${fx('First of all, for students having long school holidays might be very beneficial…','Long holidays allow children to recover from the pressure of the school year.')}
<h3>3. Связки: точность, а не количество</h3>
<p>Частая ошибка band 5.5–6: связки поставлены механически (Firstly, Secondly, Furthermore, In conclusion) в каждом предложении. Экзаменатор видит это и ставит 6.</p>
${tb(['Функция','Связки','Пример'],[['Добавление','In addition, Moreover, Another reason is that','In addition, families can travel together.'],['Контраст','However, On the other hand, Nevertheless','However, long breaks may cause knowledge loss.'],['Уступка','Although, While, Despite + noun','Despite the benefits of rest, …'],['Причина','because, since, as, due to','Due to long breaks, pupils forget key skills.'],['Следствие','As a result, Therefore, Consequently, so','As a result, teachers spend weeks on revision.'],['Пример','For instance, such as, a case in point is','For instance, a child who…'],['Итог','In conclusion, To sum up, Overall','Overall, a balance is needed.']])}
<ul><li>После вводной связки в начале предложения ставится запятая.</li><li>Не используйте Firstly и Secondly внутри абзаца, который сам начинается с First of all.</li><li>Одна и та же связка не больше двух раз за эссе.</li><li>Не ставьте However и but вместе.</li></ul>
<h3>4. Референция: местоимения и слова-заменители</h3>
<p>Повторение одного слова (children, children, children) выглядит бедно. Заменяйте.</p>
${ex('children → pupils, students, young learners, they<br>long holidays → extended breaks, lengthy summer vacations, this practice')}
${ex('Some pupils lose motivation after months of exams. <b>This problem</b> can be reduced if holidays are long enough.')}
<h3>5. Логическая цепочка внутри абзаца</h3>
<p>Каждое следующее предложение продолжает предыдущее: причина → следствие → пример. Не прыгайте между темами.</p>
${fx('Long holidays are good. Children can travel. Rest is important. They can learn new things.','Long holidays allow children to rest. Without rest, they lose motivation. For instance, a pupil who studies for ten months without a break may start disliking school.')}
<h3>6. Заключение без ошибок</h3>
${fx('In conclusion, although long school holidays have a substantial number of positive impacts…, the fact that a short vacation can preserve… (нет глагола, много лишних слов)','In conclusion, although long holidays help children relax and discover new cultures, shorter breaks may protect their academic progress. A moderate approach would therefore be most effective.')}
<h3>7. Абзацы и форматирование</h3>
<ul><li>Пустая строка или отступ между абзацами.</li><li>Один абзац = одна главная идея.</li><li>Не делайте абзац из одного предложения.</li></ul>
${co('good','Самопроверка CC','<ul><li>Можно ли понять суть абзаца только по первому предложению?</li><li>Нет ли двух связок подряд или одной связки больше двух раз?</li><li>Каждое this / they / it ссылается на понятное слово?</li><li>Заключение не вводит новые идеи?</li></ul>')}
`},

{id:'lr',title:'Lexical Resource',tag:'lr',min:14,cat:'lex',html:`
<p>На band 7 экзаменатор ищет точность: слово подходит по смыслу, сочетается с соседними словами и не повторяется. Менее частотные слова нужны, но только те, в которых вы уверены.</p>
<h3>1. Слова-повторы и замены</h3>
${tb(['Вы используете','Замена (по смыслу)'],[['beneficial / very useful','advantageous, valuable, worthwhile, has positive effects'],['significant amount of','a considerable amount of, a great deal of, plenty of'],['crucial / vital / essential','key, fundamental, indispensable, of primary importance'],['recover','recharge, rest, regain energy, unwind'],['arduous / hard year','demanding, intensive, stressful school year'],['students / children','pupils, young learners, schoolchildren'],['travel','go on trips, explore other countries, experience different cultures']])}
<p>Меняйте слово, когда оно встречается больше двух раз. Не заменяйте механически: каждая замена должна подходить по контексту. Например, <i>knowledge</i> и <i>skills</i> — разные понятия, а не синонимы.</p>
<h3>2. Неестественные сочетания</h3>
${tb(['Вы написали','Как лучше'],[['spend time for themselves','spend time on their hobbies / pursue their interests'],['acquire new knowledge about the world','learn about other cultures / broaden their horizons'],['young bodies','growing children'],['gaining a new academic knowledge','making academic progress'],['less holidays','shorter holidays / fewer holidays'],['reach more practical skills','develop practical skills'],['after all tests','after months of exams']])}
<h3>3. Collocations</h3>
<p>Учите сочетания целиком.</p>
<ul><li><b>Глагол + существительное:</b> take a break, recharge your batteries, suffer from burnout, develop skills, lose motivation, retain information, broaden horizons, cover the curriculum.</li><li><b>Прилагательное + существительное:</b> academic pressure, heavy workload, long-term benefits, hands-on experience, cultural awareness, tight schedule.</li><li><b>Существительное + предлог:</b> a break from, access to, impact on, emphasis on, benefit from.</li></ul>
<h3>4. Парафраз вопроса</h3>
${ex('Задание: Many elementary schools have long summer holidays.<br>Перефраз: Primary schools often close for two or three months in summer.')}
<p>Приёмы: синоним (elementary → primary), смена части речи (benefit → beneficial), смена структуры (Some people believe that… → It is argued by some that…).</p>
<h3>5. Чего избегать</h3>
<ul><li>Слишком редкие слова, в которых вы не уверены.</li><li>Разговорные слова и сокращения: kids, gonna, lots of, don’t. В эссе: children, going to, many, do not.</li><li>Филлеры: very, really, a lot, many many.</li><li>Клише: In today’s modern world, Since the dawn of time.</li><li>Обращение к читателю на «ты».</li></ul>
<h3>6. Как расширять словарь</h3>
<ol><li>Каждый день выписывайте 5 collocations из статьи по теме (не отдельные слова).</li><li>К каждому collocation пишите своё предложение.</li><li>Раз в неделю закройте перевод и вспомните сочетание. Для этого есть флэшкарты в разделе «Словарь».</li><li>Ведите таблицу «слово → collocations → мой пример» по темам IELTS.</li><li>Читайте IELTS Reading и статьи вроде BBC Learning English, подчёркивайте естественные сочетания.</li></ol>
`},

{id:'t1',title:'Task 1: отчёт по данным',tag:'t1',min:16,cat:'task1',html:`
<p>Task 1 (Academic) — отчёт по графику, таблице, диаграмме, процессу или карте. Время: 20 минут, минимум 150 слов (целиться в 170–190). Оценивают <b>Task Achievement</b>, а также CC, LR и GRA.</p>
${co('warn','Чего в Task 1 делать нельзя','<ul><li>Выражать мнение или объяснять причины (I think, because of the economy).</li><li>Перечислять все числа подряд.</li><li>Пропускать overview: без него Task Achievement обычно не выше 5.</li><li>Копировать формулировку задания.</li></ul>')}
<h3>Структура из 4 абзацев</h3>
${tb(['Абзац','Содержание','Пример'],[['1. Введение','Одно предложение: перефраз задания','The line graph compares the proportion of households with internet access in three countries between 2000 and 2020.'],['2. Overview','2–3 главных тренда или отличия, почти без цифр','Overall, access rose in all three countries, but the increase was far greater in Brazil and Vietnam.'],['3. Детали 1','Первая группа данных с цифрами и сравнением','In 2000, Canada was well ahead, with 40% of households online…'],['4. Детали 2','Вторая группа данных','Brazil and Vietnam started from a much lower base…']])}
<h3>Язык трендов</h3>
${tb(['Значение','Глаголы','Существительные'],[['Рост','rise, increase, climb, grow, go up, surge','a rise, an increase, a climb, growth'],['Падение','fall, decrease, decline, drop, go down, plunge','a fall, a decrease, a decline, a drop'],['Стабильность','remain stable, stay constant, level off, plateau','a plateau, stability'],['Пик / минимум','peak at, reach a high of, bottom out at, hit a low of','a peak, a low point'],['Колебания','fluctuate, vary, go up and down','fluctuations']])}
<h3>Степень и скорость</h3>
${tb(['Сильно / быстро','Слабо / медленно'],[['sharply, dramatically, rapidly, significantly, substantially','slightly, marginally, gradually, steadily, modestly']])}
<p>Наречие идёт с глаголом (<i>rose sharply</i>), прилагательное с существительным (<i>a sharp rise</i>).</p>
<h3>Предлоги</h3>
${tb(['Конструкция','Пример'],[['rose <b>from</b> X <b>to</b> Y','rose from 20% to 60%'],['increased <b>by</b> 10%','на 10 процентных пунктов (разница)'],['<b>stood at</b> / <b>reached</b> 30%','уровень в конкретный момент'],['<b>accounted for</b> 20%','составляло 20% от целого'],['<b>between</b> 2000 <b>and</b> 2010 / <b>from</b> 2000 <b>to</b> 2010','период'],['<b>in</b> 2010, <b>by</b> 2020, <b>over</b> the period','момент и период']])}
<h3>Время глагола</h3>
<ul><li>Прошедшие даты → Past Simple (rose, fell).</li><li>Будущие даты (прогноз) → will / is expected to / is projected to.</li><li>Таблица без дат → Present Simple.</li><li>Процесс → Present Simple, <b>пассив</b> (The grain is harvested, then it is washed) и слова последовательности: first, next, after that, finally.</li><li>Карта «до и после» → Past + Present Perfect, предлоги места: to the north of, adjacent to, in the centre.</li></ul>
<h3>Сравнения</h3>
${ex('Canada had a <b>higher</b> proportion than Brazil. / Brazil was <b>the second highest</b>. / Men were <b>twice as likely</b> to exercise <b>as</b> women. / The figure for A <b>was far greater than</b> that for B. / <b>Whereas</b> A fell, B rose.')}
<h3>Number или proportion?</h3>
<p>Для исчисляемого — <i>the number of cars</i>, для процентов — <i>the proportion / percentage of households</i>. Не пишите «the amount of cars».</p>
${co('good','Практика','Откройте раздел «Task 1»: 4 графика (линейный, столбчатый, круговые, таблица), таймер на 20 минут, счётчик слов, проверка overview и чек-лист. После написания можно открыть образец.')}
`},

{id:'check',title:'Тайминг и план подготовки',tag:'gen',min:6,html:`
<h3>Тайминг Task 2 на экзамене (40 минут)</h3>
${tb(['Этап','Минут'],[['Анализ вопроса и план','5'],['Написание','30'],['Проверка','5']])}
<p>Общее время Writing — 60 минут: 20 на Task 1 и 40 на Task 2. Начинать лучше с Task 1, но не тратить на него больше 20 минут.</p>
<h3>Ежедневные упражнения (выберите 2–3)</h3>
<ol>
<li><b>Исправление ошибок (10 мин).</b> Возьмите абзац из своего эссе, найдите ошибки по списку, перепишите.</li>
<li><b>Одна мысль тремя структурами (10 мин).</b> <i>Children need rest. → Although children enjoy school, they need rest. → Having studied for ten months, children need rest.</i></li>
<li><b>PEEL-абзац (20 мин).</b> Тема на сегодня, абзац 100 слов с таймером.</li>
<li><b>Перефраз вопроса (5 мин).</b> Три вопроса IELTS, каждый двумя способами.</li>
<li><b>Чтение и подчёркивание (15 мин).</b> Статья, 5 collocations и топ-3 связки.</li>

</ol>
<h3>Раз в неделю: полное эссе</h3>
<ol><li>5 минут: план (тип вопроса, 2 идеи, примеры).</li><li>30–35 минут: написание.</li><li>5 минут: проверка по чек-листу.</li><li>После: сравните с примером band 7–8 (раздел «Образцы») и выпишите 5 новых выражений.</li></ol>
<h3>Ориентиры по прогрессу</h3>
${tb(['Результат','Что должно быть'],[['Band 6.0','Нет фрагментов, правильный порядок слов, заключение завершено'],['Band 6.5','PEEL во всех абзацах, 5–6 связок разной функции, 8–10 collocations по теме'],['Band 7.0','Разнообразные сложные структуры без ошибок, идеи развиты с конкретными примерами, словарь без повторов']])}
<p class="muted sm">Числа в этой таблице — эвристики автора гайда, а не официальные нормы.</p>
`}
];

function sentencesOf(t){return t.replace(/\n+/g,' \n ').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean)}
function analyze(text,kind){

  const lw=t.toLowerCase().match(/[a-z][a-z'’-]*/g)||[];

    conc:cnt(/\b(although|though|whereas|despite|in spite of)\b|(?:^|[.!?,]\s*)while\b/gi),
    rel:cnt(/\b(who|whom|whose|which|where)\b/gi),
    cond:cnt(/\b(if|unless|provided that)\b/gi),

    part:sents.filter(s=>partRe.test(s)).length+cnt(/\b(instead of|without)\s+[a-z]+ing\b/gi)

/* ===== CHARTS ===== */
const COLS=['c1','c2','c3','c4','c5'];
function lineChart(d){
  const W=640,H=340,L=46,R=18,T=16,B=38,pw=W-L-R,ph=H-T-B;
  const X=i=>L+pw*i/(d.x.length-1),Y=v=>T+ph-ph*v/d.ymax;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line graph">`;
  for(let v=0;v<=d.ymax;v+=d.step)s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  d.x.forEach((x,i)=>{s+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle">${x}</text>`});
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  d.series.forEach((se,k)=>{
    const pts=se.v.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    s+=`<g class="${COLS[k]}"><polyline points="${pts}" fill="none" style="stroke:var(--c)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`+
      se.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" style="stroke:var(--c);fill:var(--surface)" stroke-width="2.2"><title>${se.n}, ${d.x[i]}: ${v}%</title></circle>`).join('')+`</g>`;
  });
  return s+'</svg>';
}
function barChart(d){
  const W=640,H=340,L=46,R=18,T=26,B=38,pw=W-L-R,ph=H-T-B,n=d.groups.length,k=d.series.length;
  const gw=pw/n,bw=Math.min(46,gw*.7/k);
  const Y=v=>T+ph-ph*v/d.ymax;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">`;
  for(let v=0;v<=d.ymax;v+=d.step)s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  d.groups.forEach((g,i)=>{
    const cx=L+gw*i+gw/2;
    s+=`<text x="${cx}" y="${H-12}" text-anchor="middle">${g}</text>`;
    d.series.forEach((se,j)=>{
      const x=cx-bw*k/2+bw*j+(j?1.5:-1.5),v=se.v[i];
      s+=`<g class="${COLS[j]}"><rect x="${x}" y="${Y(v)}" width="${bw-3}" height="${Y(0)-Y(v)}" rx="3" style="fill:var(--c)"><title>${se.n}, ${g}: ${v}%</title></rect><text x="${x+(bw-3)/2}" y="${Y(v)-6}" text-anchor="middle" class="lbl">${v}</text></g>`;
    });
  });
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return s+'</svg>';
}
function pieChart(d){
  const W=640,H=320,r=96,cy=160,cxs=[170,470];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pie charts">`;
  d.charts.forEach((c,ci)=>{
    const cx=cxs[ci];let a=-Math.PI/2;const tot=c.parts.reduce((x,p)=>x+p[1],0);
    c.parts.forEach((p,k)=>{
      const da=p[1]/tot*2*Math.PI,a2=a+da,large=da>Math.PI?1:0;
      const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      s+=`<g class="${COLS[k]}"><path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" style="fill:var(--c);stroke:var(--surface)" stroke-width="2"><title>${p[0]}: ${p[1]}%</title></path></g>`;
      const m=a+da/2,lx=cx+(r+20)*Math.cos(m),ly=cy+(r+20)*Math.sin(m)+4;
      s+=`<text class="lbl" x="${lx}" y="${ly}" text-anchor="middle">${p[1]}%</text>`;
      a=a2;
    });
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="lbl" style="font-size:15px">${c.label}</text>`;
  });
  return s+'</svg>';
}
function legendOf(t){
  const names=t.type==='pie'?t.data.charts[0].parts.map(p=>p[0]):t.type==='table'?[]:t.data.series.map(s=>s.n);

function tableOf(d){return `<div class="tw"><table><thead><tr>${d.head.map((h,i)=>`<th class="${i?'num':''}">${h}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'num':''}">${c}${i&&i<3?'%':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function dataTable(t){

  if(t.type==='pie'){const p=t.data.charts;return `<div class="tw"><table><thead><tr><th></th>${p.map(c=>`<th class="num">${c.label}</th>`).join('')}</tr></thead><tbody>${p[0].parts.map((x,i)=>`<tr><td>${x[0]}</td>${p.map(c=>`<td class="num">${c.parts[i][1]}%</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

}
function chartOf(t){
  if(t.type==='line')return lineChart(t.data);
  if(t.type==='bar')return barChart(t.data);
  if(t.type==='pie')return pieChart(t.data);
  return tableOf(t.data);
}
// progress line chart (overall bands over time)
function trendChart(vals,target){
  const W=640,H=240,L=40,R=16,T=14,B=26,pw=W-L-R,ph=H-T-B,lo=4,hi=9;
  const Y=v=>T+ph-ph*(v-lo)/(hi-lo),X=i=>vals.length<2?L+pw/2:L+pw*i/(vals.length-1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Динамика оценок">`;
  for(let v=lo;v<=hi;v++)s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" style="stroke:var(--good)" stroke-width="1.6" stroke-dasharray="5 5"/><text x="${W-R}" y="${Y(target)-6}" text-anchor="end" style="fill:var(--good)">цель ${target.toFixed(1)}</text>`;
  s+=`<polyline class="c1" points="${vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" style="stroke:var(--s1)" stroke-width="2.6" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" style="stroke:var(--s1);fill:var(--surface)" stroke-width="2.2"><title>${v.toFixed(1)}</title></circle>`;if(i===vals.length-1)s+=`<text class="lbl" x="${X(i)}" y="${Y(v)-10}" text-anchor="middle">${v.toFixed(1)}</text>`});
  return s+'</svg>';
}

{id:'rd1',title:'Reading 6.0→7.0: поиск по парафразу',tag:'rd',min:8,cat:'rdq',html:`
<p>Переход с 6.0 на 7.0 — это не скорость чтения, а точность: научиться находить зону ответа через синонимы и проверять смысл целиком.</p>
${co('','Сколько ответов нужно для band','Единая таблица ориентиров собрана в разделе «Официально». Значения приблизительные: шкала зависит от версии теста.<br><br><button class="btn sm" data-go="official">Открыть таблицу</button>')}
<h3>Алгоритм одного вопроса</h3>
<ul><li>Подчеркните редкие слова вопроса: имена, числа, термины. Общие слова не ищите.</li><li>Предскажите парафраз и найдите зону в 2–3 предложения.</li><li>Сверьте смысл полностью: подлежащее, время, степень и усилители (all, only, never).</li></ul>
<h3>Виды парафраза</h3>
<ul><li>Синонимы: rise → surge, harmful → detrimental.</li><li>Смена части речи: decide → decision.</li><li>Активный и пассив, обобщение: buses, cars → vehicles.</li><li>Антоним с отрицанием: reduce → not increase.</li></ul>
${fx('Prices rose sharply. → Costs fell dramatically.','Ответ: False (rose и fell противоречат)','Совпал тип изменения, но направление противоположное.')}`},
{id:'rd2',title:'Reading 7.0→8.0: Headings, Summary, MCQ',tag:'rd',min:9,cat:'rdq',html:`
<p>На уровне 7.5+ ошибки происходят в «сложных» типах заданий. Здесь нужны отдельные техники.</p>
<h3>Matching Headings</h3>
<ul><li>Прочитайте абзац целиком: главную идею дают первое и последнее предложения плюс связки.</li><li>Начните с самых очевидных абзацев и вычёркивайте использованные заголовки.</li><li>Лишние заголовки описывают деталь или другой абзац.</li></ul>
<h3>Summary и Sentence Completion</h3>
<ul><li>Пропуски идут в порядке текста. Определите часть речи пропуска.</li><li>Берите слова из текста в исходной форме и проверяйте лимит.</li></ul>
<h3>Multiple Choice и Yes/No/Not Given</h3>
<ul><li>Исключайте варианты: слишком общий, слишком узкий, верный факт не из текста, усилитель.</li><li>Yes/No/NG спрашивает про мнение автора. Маркеры: arguably, it seems, unfortunately.</li></ul>
${co('warn','Типичная потеря','При NG кандидаты додумывают «логичный» вывод. Если прямого подтверждения нет, ответ Not Given.')}`},
{id:'rd3',title:'Reading 8.0→9.0: темп и сложные тексты',tag:'rd',min:8,cat:'rdq',html:`
<p>Band 8.5–9.0 требует 37–39 верных ответов. Отличие сильных — дисциплина времени и чтение структуры аргумента.</p>
<h3>Тайминг</h3>
<ul><li>Текст 1: 15–17 минут. Текст 2: 19–20 минут. Текст 3: 23–25 минут.</li><li>Последние 3–5 минут — на проверку орфографии и лимита слов.</li><li>Вопрос, не поддавшийся за 90 секунд, отметьте и вернитесь.</li></ul>
<h3>Читаем аргумент</h3>
<ul><li>Структура: тезис, доказательства, контраргумент, вывод.</li><li>Слова however, albeit, nevertheless, arguably показывают, где автор ставит своё мнение.</li><li>Hedging (may, tends to, appears to) меняет ответ True на Not Given при категоричном утверждении.</li></ul>
<h3>Ошибки на 8+</h3>
<ul><li>Лишнее слово сверх лимита и орфография.</li><li>Пропущенное отрицание (not, hardly, rarely).</li><li>Слепое доверие слову из вопроса, найденному в тексте.</li></ul>`},
{id:'ls1',title:'Listening 6.0→7.0: предсказание и ловушки',tag:'ls',min:8,cat:'lsq',html:`
<p>Listening даёт самый быстрый рост, если работать с ловушками, а не слушать «всё подряд».</p>
${co('','Сколько ответов нужно для band','Единая таблица ориентиров собрана в разделе «Официально». Значения приблизительные: шкала зависит от версии теста.<br><br><button class="btn sm" data-go="official">Открыть таблицу</button>')}
<h3>Pre-listening 30 секунд</h3>
<ul><li>Определите тип ответа: число, имя, место, прилагательное.</li><li>Подчеркните ключи и ожидайте синонимы в записи.</li><li>Заметьте навигаторы: First, After that, Finally.</li></ul>
<h3>Главные ловушки</h3>
<ul><li>Self-correction: Tuesday… sorry, Thursday.</li><li>Числа: fifteen и fifty, double nine = 99, oh = 0.</li><li>Дистракторы в MCQ: упомянуты все варианты, верный подтверждён позже.</li></ul>
${fx('Услышали fifteen и записали 50','Записали 15','В fifteen ударение на втором слоге (fifTEEN), в fifty — на первом (FIFty).')}`},
{id:'ls2',title:'Listening 7.0→8.0: карты, Part 3 и Part 4',tag:'ls',min:9,cat:'lsq',html:`
<p>Выше 7.0 теряют баллы на картах, мнениях и лекциях. Тренируйте именно эти форматы.</p>
<h3>Карты и планы</h3>
<ul><li>Найдите точку отсчёта (вход, река, ворота) и направление движения.</li><li>Слушайте предлоги: opposite, adjacent to, beyond, just before.</li></ul>
<h3>Part 3: несколько говорящих</h3>
<ul><li>Следите, кто чьё мнение высказал: вопросы часто спрашивают про одного говорящего.</li><li>Маркеры сомнения: That is true, but… / I am not so sure. Они меняют ответ.</li></ul>
<h3>Part 4: лекция</h3>
<ul><li>Нет диалога, поэтому структура лекции — ваша опора: введение, пункты, вывод.</li><li>Термины перефразируются: читайте заголовки заметок как навигатор.</li></ul>`},
{id:'ls3',title:'Listening 8.0→9.0: скорость, акценты, ошибки',tag:'ls',min:8,cat:'lsq',html:`
<p>Для 9.0 нужно почти идеальное внимание: каждая ошибка — это потерянные полбалла.</p>
<h3>Тренировка слуха</h3>
<ul><li>Диктант 3 минуты ежедневно с разбором каждой ошибки.</li><li>Shadowing: повторяйте за диктором вслух, копируя интонацию.</li><li>Тренируйтесь на скорости 1.25x, чтобы экзамен казался медленнее.</li></ul>
<h3>Акценты</h3>
<ul><li>Британский, австралийский (day звучит как die), канадский, американский с flapped t (water → wader).</li><li>Слушайте BBC, ABC, CBC, TED и университетские лекции.</li></ul>
<h3>Журнал ошибок</h3>
<ul><li>Запишите: что услышал, что написал, причина (число, парафраз, орфография, окончание -s).</li><li>Через неделю повторите те же типы заданий и сравните.</li></ul>
${co('warn','Орфография','В Listening проверяется точное написание. Следите за -s, -ed и дефисами: accommodation, enrolment, questionnaire.')}`},
{id:'sp1',title:'Speaking: что слышит экзаменатор на 6, 7, 8, 9',tag:'sp',min:9,cat:'spq',html:`
<p>Оценка складывается из четырёх критериев по 25%. Понимайте, чем отличаются уровни, и тренируйте именно эту разницу.</p>
${tb(['Критерий','Band 6','Band 7','Band 8–9'],[['Fluency &amp; Coherence','Готов говорить долго, но бывают повторы и самоисправления','Говорит развёрнуто без заметных усилий, использует связки','Паузы только на содержание; логика и связки естественны'],['Lexical Resource','Достаточный словарь, умеет перефразировать','Гибкость, менее частотные слова и collocations','Широкий, точный словарь, идиомы к месту'],['Grammar','Простые и сложные структуры, есть ошибки','Разнообразие, многие предложения без ошибок','Почти без ошибок, полный диапазон структур'],['Pronunciation','Понятно, но особенности нестабильны','Разнообразие признаков, понятно почти всегда','Устойчивый ритм, интонация, ударение; акцент не мешает']])}
<h3>Что тренировать в первую очередь</h3>
<ul><li>Беглость: говорите связно, перефразируйте вместо молчания.</li><li>Лексику: 2–3 collocations на каждую тему, не заученный монолог.</li><li>Произношение: запись на телефон и сравнение с носителем.</li></ul>`},
{id:'sp2',title:'Part 2 на band 8: структура и приёмы',tag:'sp',min:9,cat:'spq',html:`
<p>Part 2 — две минуты монолога. Сильные ответы выстроены как короткий рассказ с деталями и рефлексией.</p>
<h3>Структура ответа</h3>
<ul><li>Вступление с крючком: One experience that really stands out is…</li><li>Контекст: когда, где, кто.</li><li>Развитие: что произошло, детали, чувства.</li><li>Рефлексия: почему это важно, чему научило, что изменилось.</li></ul>
<h3>Приёмы сильного ответа</h3>
<ul><li>Смешивайте времена: past, present perfect, would.</li><li>Добавляйте контраст: What I had not anticipated was…</li><li>Если идеи кончились, вернитесь к ощущениям и вывод: Looking back, I would say…</li></ul>
${fx('It was a good trip. I was happy.','It was, hands down, the best trip I have ever taken, the kind of experience that genuinely shifted my outlook.','Точные collocations и придаточные дают и лексику, и грамматику.')}`},
{id:'sp3',title:'Part 3 и произношение: band 8–9',tag:'sp',min:9,cat:'spq',html:`
<p>В Part 3 решается высокая оценка. Вопросы абстрактные, и важна ясная логика рассуждения.</p>
<h3>Формула рассуждения</h3>
<ul><li>Позиция, причина, пример, уступка: Position, Reason, Example, Concession.</li><li>Hedging: It could be argued that… / To a certain extent… / Admittedly…</li><li>Сравнение времён и стран: Compared with the past, people nowadays…</li></ul>
<h3>Идиомы к месту</h3>
<ul><li>a double-edged sword, the tip of the iceberg, raise the bar.</li><li>Одной-двух на ответ достаточно. IELTS Advantage предупреждает: неверно употреблённые идиомы снижают балл, поэтому берите только те, что знаете точно.</li></ul>
<h3>Произношение</h3>

const vVL=l=>window.speechSynthesis?speechSynthesis.getVoices().filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(l)):[];
const vSc=v=>(/natural/i.test(v.name)?100:0)+(/online|neural|premium|enhanced|siri/i.test(v.name)?50:0)+(/google/i.test(v.name)?30:0)+(v.localService?0:10);
function vVoice(l){const a=vVL(l).sort((x,y)=>vSc(y)-vSc(x));return(l==='ru'&&VID.vn&&a.find(v=>v.name===VID.vn))||(l==='en'&&VID.en&&a.find(v=>v.name===VID.en))||a[0]}
let vMt=0;
function vTalk(on){const a=document.getElementById('vav');if(a)a.classList.toggle('talk',on);clearInterval(vMt);const m=document.getElementById('vmo');if(!m)return;if(on)vMt=setInterval(()=>{m.style.transform='scaleY('+(.2+Math.random()*.9).toFixed(2)+')'},110);else m.style.transform='scaleY(.12)'}
function vSayOne(t,l,k,rate){return new Promise(res=>{const done=()=>{vTalk(false);res()};const ms=Math.max(1500,t.length*80);vTalk(true);if(!window.speechSynthesis||!vVL(l.slice(0,2)).length){setTimeout(done,ms);return}
  const u=new SpeechSynthesisUtterance(t);u.lang=l;const v=vVoice(l.slice(0,2));if(v)u.voice=v;u.rate=rate+((k%3)-1)*.02;u.pitch=1+(k%2?.04:-.01);const to=setTimeout(done,ms*3+3000);u.onend=u.onerror=()=>{clearTimeout(to);done()};speechSynthesis.speak(u)})}
async function vListen(t){const my=VID.tok;window.speechSynthesis&&speechSynthesis.cancel();const b=document.querySelector('[data-act=say]');if(b)b.disabled=true;
  const ss=t.match(/[^.!?]+[.!?]*/g)||[t];for(let k=0;k<ss.length;k++){await vSayOne(ss[k].trim(),'en-GB',k,.88);await vSlp(300)}if(b)b.disabled=false}
function vFill(){const s=document.getElementById('vsel');if(!s)return;const a=vVL('ru').sort((x,y)=>vSc(y)-vSc(x));s.innerHTML=a.length?a.map(v=>`<option value="${v.name}">${vSc(v)>=100?'★ ':''}${v.name.replace(/Microsoft |Online |\(Natural\)|- Russian.*/g,'').trim()}</option>`).join(''):'<option>нет русского голоса</option>';if(VID.vn)s.value=VID.vn;s.onchange=()=>{VID.vn=s.value;try{localStorage.setItem('iws:voice',s.value)}catch(e){}};const h=document.getElementById('vhint');if(h)h.hidden=a.some(v=>vSc(v)>=100)}

{id:'w1',title:'Путь к band 8: что меняется с 5 до 8',tag:'gen',min:10,cat:'wb8',html:`
<p>Итог Writing: (Task 1 + 2 × Task 2) ÷ 3. Каждый критерий весит 25%. Для band 8 нужна не «сложная лексика», а точность, развитие идей и безошибочность.</p>
${tb(['Критерий','Band 5','Band 6–7','Band 8'],[['Task Response','Не отвечает на все части вопроса: выше 5 нельзя','Идеи есть; band 6 без развития, band 7 развиты, но общо','Идеи раскрыты конкретно, пример точный'],['Coherence &amp; Cohesion','Много идей в абзаце, связки в избытке или с ошибками','Одна идея в абзаце, связки разнообразны, местами лишние','Одна идея в абзаце, связки точны и без перебора'],['Lexical Resource','Мало тематических слов, повторы вопроса','Тематические слова с ошибками формы и орфографии','Точные менее частотные слова, почти без повторов'],['Grammar','Простые предложения, ошибки мешают понимать','Микс простых и сложных; band 7 около половины без ошибок','Широкий диапазон, большинство предложений без ошибок']])}
<h3>Что даёт скачок</h3>
<ul><li>Ответьте на каждую часть вопроса. Problems — это не causes.</li><li>В каждом абзаце одна идея: тезис, объяснение, пример.</li><li>Связки не дают баллов за лексику, а в каждом предложении снижают оценку.</li><li>Используйте только те структуры, в которых уверены на 100%.</li></ul>
${co('warn','Правило','Баллов за «умные» слова нет. Нужны точные слова и отсутствие ошибок. Пример: неверно употреблённое длинное слово хуже простого точного.')}`},
{id:'w2',title:'Структуры для 5 типов эссе',tag:'cc',min:10,cat:'wb8',html:`
<p>Общий каркас: введение, два основных абзаца, заключение. Внутри содержание зависит от типа вопроса. Ни одна структура не гарантирует 8, но хорошая даёт Coherence.</p>
${tb(['Тип вопроса','Введение','Основные абзацы','Заключение'],[['Opinion (agree / disagree)','Парафраз + ваша позиция и главные идеи','Каждый: тезис, объяснение, пример','Итог и позиция'],['Advantages / disadvantages','Парафраз + что будет обсуждаться','1: два плюса с объяснением и примером; 2: два минуса','Итог плюсов и минусов'],['Discussion (both views + opinion)','Парафраз, обе позиции, ваш тезис','1: первое мнение, обсуждение, согласны ли, пример; 2: второе','Итог и что важнее'],['Problem / solution','Парафраз + что будет обсуждаться','1: проблемы и объяснения, пример; 2: решения и пример','Итог'],['Two-part','Парафраз, упомяните оба вопроса','1: прямой ответ на первый, почему, пример; 2: на второй','Итог']])}
<h3>Типичные потери</h3>
<ul><li>Discussion без вашего мнения: потолок 5.</li><li>Two-part: на оба вопроса нужен прямой ответ.</li><li>Один шаблон на все типы вопросов.</li></ul>
${co('','Совет','Тренируйтесь на 100+ реальных вопросах и сначала определяйте тип вопроса, потом пишите план.')}`},
{id:'w3',title:'Развитие идеи: от band 6 к band 8',tag:'tr',min:10,cat:'wb8',html:`
<p>Разница между 6, 7 и 8 по Task Response — в поддержке идей. Band 6: идея без объяснения. Band 7: объяснение и пример, но общие. Band 8: конкретные и точные.</p>
<h3>Формула абзаца</h3>
<ul><li>Topic sentence: одна идея.</li><li>Explanation: почему это так, механизм.</li><li>Example: конкретный пример с местом, цифрой или периодом.</li></ul>
${fx('Cars cause traffic jams. There are many cars these days.','Rising car ownership overloads road networks built for far fewer vehicles. In Jakarta, for example, rush-hour journeys can take twice as long as a decade ago.','Объяснение даёт причину, пример конкретен.')}
${fx('Sports are good. For example, many people play sports.','Regular exercise lowers the risk of heart disease, which reduces pressure on public health systems. In Finland, for example, national fitness campaigns coincided with a marked fall in cardiovascular deaths.','Пример подтверждает именно эту мысль.')}
<h3>Как придумывать идеи</h3>
<ul><li>Спрашивайте: почему? для кого? к чему приведёт?</li><li>Смотрите с позиций личности, общества, экономики, здоровья, образования.</li><li>Один пример подтверждает одну мысль.</li></ul>
${co('','Если нет примера','Придумайте правдоподобный. Экзаменатор оценивает умение развить мысль, а не знание фактов.')}`},
{id:'w4',title:'Task 1 Academic: путь к band 8',tag:'t1',min:10,cat:'wb8',html:`
<p>Task 1 — треть оценки Writing: около 20 минут, минимум 150 слов (целитесь в 160–170). Главная ценность — отбор данных и сильный overview.</p>
<h3>Структура из четырёх абзацев</h3>
<ul><li>Introduction: парафраз вопроса другими словами.</li><li>Overview: обычно 1–2 предложения о наиболее заметных тенденциях, различиях или этапах. Не нужно перечислять все данные; точные цифры лучше раскрывать в деталях.</li><li>Details 1 и 2: данные, подтверждающие признаки из overview.</li><li>Заключения нет: оно выражает мнение, а вы только описываете.</li></ul>
<h3>Как выбрать признаки</h3>
<ul><li>Динамические графики: общий тренд, рост и падение, колебания, пик и минимум, исключения.</li><li>Статические: максимумы и минимумы, самые заметные различия, сходства, исключения.</li><li>Не перечисляйте все цифры: выбирайте главное и сравнивайте.</li></ul>
<h3>Что отличает 8 от 6</h3>
<ul><li>Отсутствие или неясность overview существенно ослабляет Task Achievement. Чёткий overview помогает, но не гарантирует определённый band.</li><li>Никаких причин и личных знаний: только данные.</li><li>В overview используйте сложные предложения: while, whereas, although, with.</li></ul>
${fx('The chart shows sales. In 2010 sales were 20 and in 2015 35.','Overall, sales rose steadily, while returns stayed low throughout the period.','Overview называет тренды без цифр. Цифры переносим в детали.')}
${co('','Карты и процессы','Карты многие считают самым простым типом. Для процессов нужен свой подход: этапы и последовательность в пассиве.')}`},
{id:'w5',title:'Task 1 General Training: письма',tag:'t1',min:7,cat:'wb8',html:`
<p>В General Training Task 1 — письмо. Минимум 150 слов, около 20 минут. Главное — правильный тон и раскрытие всех пунктов.</p>
<h3>Формальное или неформальное</h3>
<ul><li>Письмо другу — неформальное. Любому другому адресату — формальное.</li><li>Сокращения (I\u2019m, don\u2019t) и идиомы допустимы только в неформальном письме.</li><li>В формальном используйте полные формы и вежливые обороты.</li></ul>
<h3>Структура</h3>
<ul><li>Приветствие по тону письма.</li><li>Новый абзац на каждый пункт задания.</li><li>Прощание по тону и имя под ним.</li><li>Проверьте орфографию и тон: нельзя смешивать стили.</li></ul>
${fx('Hi Sir, I want to complain, it\u2019s really bad.','Dear Sir or Madam, I am writing to complain about the service I received on 12 May.','Формальное письмо: цель в первом предложении, полные формы, вежливый тон.')}`},
{id:'w6',title:'Лексика и грамматика для band 8',tag:'lr',min:10,cat:'wb8',html:`
<p>На band 8 лексика и грамматика — это точность. Длинные слова, используемые неверно, снижают оценку.</p>
<h3>Лексика</h3>
<ul><li>Используйте тематические слова вместо повторов вопроса: unemployment, downturn, recession.</li><li>Выбирайте менее частотные слова, но только те, что знаете точно, с их collocations.</li><li>Проверяйте словообразование и орфографию. Синонимы без проверки сочетаемости опасны.</li><li>Связки не входят в оценку Lexical Resource.</li></ul>
${fx('Many young people don\u2019t have a job because there is no money.','Youth unemployment has risen as the economic downturn has reduced hiring.','Тематические слова вместо повторов и общих слов.')}
<h3>Грамматика</h3>
<ul><li>Сложное предложение — это две и более клаузы: although, because, which, if.</li><li>Band 7: около половины предложений без ошибок. Band 8: большинство.</li><li>Ведите список 1–2 своих повторяющихся ошибок и проверяйте его при каждом эссе.</li></ul>
${fx('Although it is useful, but it costs money.','Although it is useful, it costs money.','Although и but вместе не ставят.')}`},
{id:'w7',title:'План на 4 недели к band 8 и тайминг',tag:'gen',min:8,cat:'wb8',html:`
<p>Для роста нужна практика с обратной связью. Тренировка без проверки почти не меняет балл.</p>
<h3>Тайминг на 60 минут</h3>
<ul><li>Task 1 (20 минут): 3 минуты анализ, 13 минут писать, 4 минуты проверка.</li><li>Task 2 (40 минут): 8–10 минут план, 25 минут писать, 5 минут проверка.</li><li>Не оставляйте эссе без заключения: без него высокий балл маловероятен.</li></ul>
<h3>Неделя 1: диагностика</h3>
<ul><li>Напишите 2 эссе и проверьте их в разделе «ИИ-проверка».</li><li>Выпишите 5 повторяющихся ошибок.</li></ul>
<h3>Неделя 2: структура и идеи</h3>
<ul><li>По одному абзацу в день: тезис, объяснение, пример.</li><li>Разберите все 5 типов эссе.</li></ul>
<h3>Неделя 3: Task 1 и язык</h3>
<ul><li>4 overview и 2 полных отчёта.</li><li>Работа над списком ошибок и тематической лексикой.</li></ul>
<h3>Неделя 4: полные тесты</h3>
<ul><li>3 полных Writing по 60 минут с проверкой.</li><li>Повторите слабые критерии и итоговый список ошибок.</li></ul>`}
);

{id:'sp4',title:'Фразы band 7–9: как их использовать',tag:'sp',min:9,cat:'spq',html:`
<p>Руководство IELTS Advantage разобрало более 50 записей Speaking с ответами band 7–9 и выделило около ста самых полезных фраз. Главное: фраза нужна для функции, а не для украшения.</p>
<h3>Мнение и время на раздумье</h3>
<ul><li>Мнение: From my perspective, I’m inclined to believe, I’d argue that, In my experience.</li><li>Паузы: Well, let me see; How should I put this; That’s a tough one; Off the top of my head.</li><li>Откровенность: To be perfectly honest, If I had to choose.</li></ul>
<h3>Связки, примеры и вывод</h3>
<ul><li>Добавить: Furthermore, Moreover, What’s more. Контраст: Nevertheless, Having said that, On the flip side.</li><li>Пример: For instance, A case in point would be, To illustrate this.</li><li>Итог: All things considered, On balance, Ultimately, At the end of the day.</li></ul>
<h3>Оттенки и точность</h3>
<ul><li>Частичное согласие: To some extent, To a certain degree, More or less.</li><li>Обобщение: By and large, For the most part, Relatively speaking.</li><li>Степень: Substantially, Considerably, Marginally.</li></ul>
${fx('Yes. I think it is good. Also it is bad.','I have mixed feelings about it. On the one hand, it saves time. Having said that, it can isolate people.','Фразы показывают позицию и баланс, а не просто удлиняют ответ.')}
${co('warn','Правило','Не заучивайте блоками и не вставляйте фразы в каждый ответ. Authentic, разговорная речь часто оценивается выше, чем принуждённые академические обороты.')}`},
{id:'sp5',title:'План развития словаря: читать, записывать, повторять',tag:'sp',min:7,cat:'spq',html:`
<p>Словарь растёт от регулярной работы, а не от одного списка. Метод из трёх шагов: читать и слушать, записывать, повторять.</p>
<h3>Читайте и слушайте</h3>
<ul><li>Выбирайте то, что вам действительно интересно: новости, подкасты, TED, YouTube.</li><li>Встретив новое слово, сначала догадайтесь о значении по контексту.</li><li>Читайте и слушайте каждый день, в том числе по дороге.</li></ul>
<h3>Записывайте с пользой</h3>
<ul><li>Тетрадь или приложение (Memrise, Quizlet).</li><li>Кроме значения, записывайте collocations, синонимы, антонимы, произношение и пример предложения.</li></ul>
<h3>Повторяйте по расписанию</h3>
<ul><li>5–10 минут в день эффективнее, чем зубрёжка накануне.</li><li>Повтор через неделю, две недели и месяц после первой встречи со словом.</li><li>Используйте слова в ответах Speaking и в эссе, когда это уместно.</li></ul>
${co('','В приложении','Раздел «Speaking · Фразы 7–9» ведёт тетрадь повторения: нажмите ＋ у фразы, и сайт напомнит повторить её через 7, 14 и 30 дней.')}`}

<p>Частая причина «потолка» 6.5: английский хороший, но кандидат не отвечает на заданный вопрос. Беглость и экзаменационная стратегия — разные навыки.</p>
