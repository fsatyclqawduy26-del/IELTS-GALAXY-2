{id:'w8',title:'Task 2 Builder: введение за 5 минут',tag:'tr',min:9,cat:'wb8',html:`
<p>Метод по рабочей тетради IELTS Advantage: введение строится за пять коротких этапов, первые три — только мышление, без письма. Всё вместе около 5 минут.</p>
<h3>Анализ и позиция</h3>
<ul><li>Три слоя вопроса: общая тема, конкретные ключевые слова, инструкция (что именно сделать).</li><li>Двойной вопрос: ответьте на обе части, иначе Task Response получает потолок. Отметьте в плане оба вопроса.</li><li>Позицию выбирайте по лёгкости аргументации: где вам проще объяснить и доказать.</li></ul>
<h3>Идеи методом прямого вопроса</h3>
<ul><li>Не устраивайте мозговой штурм на 10 идей. Задайте себе один прямой вопрос и возьмите самый очевидный ответ: что сказали бы сто случайных людей.</li><li>Проверка идеи: понятна всем, понятна экзаменатору, отвечает именно на этот вопрос, о ней легко написать абзац. Все четыре «да».</li><li>Простая развитая идея выигрывает у сложной неразвитой: band 8 против 6.5.</li></ul>
<h3>Парафраз и сборка введения</h3>
<ul><li>Меняйте и слова (синонимы по смыслу), и структуру (активный на пассив, порядок частей).</li><li>Проверка: смысл сохранён, грамматика верна, достаточно отличается от оригинала. Повторить одно-два слова допустимо.</li><li>Введение: парафраз + краткий ответ на первый вопрос + чёткая позиция по второму, без примеров и колебаний. Один абзац, 2–3 предложения.</li></ul>
${fx('More people work from home these days. Why? Is it positive or negative?','Remote work has become increasingly common, mainly because modern technology makes offices less necessary, and I believe this is a largely positive trend as it saves people time and money.','Три элемента в одном абзаце: парафраз, причина, позиция.')}`},
{id:'w9',title:'Task 2 Builder: основной абзац',tag:'cc',min:10,cat:'wb8',html:`
<p>Введение — обещание экзаменатору. Основные абзацы его выполняют: первый развивает ответ на первый вопрос, второй на второй.</p>
<h3>Три элемента абзаца</h3>
<ul><li>Topic sentence: парафраз идеи из введения, одна мысль, коротко.</li><li>Explanation: метод «So what?». Объясняйте так, будто читателю десять лет и он ничего не знает. Спрашивайте себя «и что из этого?», пока есть что развить.</li><li>Example: должен прямо доказывать вашу тему, а не просто касаться общей темы.</li></ul>
<h3>Как выбрать пример</h3>
<ul><li>Очевидный (компании, продукты, страны), практичный (то, что происходит сейчас) или личный.</li><li>Личный пример переводите в общее утверждение: «My sister’s bookshop closed» → «Many small bookshops have closed because of online competition».</li><li>Не придумывайте статистику вроде «исследование 2023 года показало 82%». Пример может быть вымышленным, но правдоподобным.</li></ul>
<h3>Главная потеря в Coherence</h3>
<ul><li>Абзац доказывает не то, что обещало введение. Оба довода могут быть верны, но вы сменили направление молча. Перед завершением абзаца сверяйтесь с введением.</li></ul>
${fx('Remote work is good. For example, many people work remotely.','Remote work saves people hours of commuting. That time can go to family, rest or study, which makes employees less stressed. For example, many office staff in large cities used to spend two hours a day on trains, and working from home gave that time back.','Пример здесь доказывает именно сэкономленное время, а не просто повторяет тему.')}`},
{id:'w10',title:'Task 2 Builder: вывод и проверка',tag:'cc',min:8,cat:'wb8',html:`
<p>Заключение коротко, но здесь много потерь. Оно целиком собирается из введения.</p>
<h3>Три элемента вывода</h3>
<ul><li>Связка: In conclusion или To conclude. Красивые замены баллов не дают.</li><li>Ваша позиция ещё раз, без колебаний. Критерии требуют ясной позиции на протяжении всего текста, повтор не запрещён.</li><li>Краткий пересказ главных идей другими словами, без копирования.</li></ul>
<ul><li>Новые идеи в выводе недопустимы. Если мысли не было во введении, ей здесь не место.</li><li>Не ищите натянутых синонимов: естественный повтор лучше неудачной замены.</li></ul>
<h3>Три прохода проверки</h3>
<ul><li>В конце каждого предложения: грамматика и слова.</li><li>В конце каждого абзаца: логика и согласованность.</li><li>В конце всего эссе: вывод совпадает с введением, нигде нет противоречий.</li></ul>
<h3>Чек-лист</h3>
<ul><li>Не меньше 250 слов и ответ на все части вопроса.</li><li>Позиция ясна везде, идеи объяснены, а не перечислены.</li><li>Четыре чётких абзаца, связки без перебора.</li><li>Если не успеваете проверить за 40 минут, тренируйте скорость планирования и грамматики, а не «лайфхаки».</li></ul>`}
)}

{id:'ls4',title:'Multiple Choice: слушаем всё, выбираем в конце',tag:'ls',min:9,cat:'lsq',html:`
<p>В Multiple Choice звучат все три варианта, и это не случайность. Правильный не обязательно первый и не самый громкий: это тот, что отвечает на заданный вопрос.</p>
<h3>Три проблемы и решения</h3>
<ul><li>Выбор первого услышанного: неверные варианты нарочно называют первыми. Дождитесь конца обсуждения.</li><li>Поиск точных слов: верный вариант почти всегда перефразирован. Придумайте заранее другие способы сказать то же.</li><li>Похожие варианты: найдите в каждом одно слово, которое делает его отличным от остальных.</li></ul>
<h3>До записи</h3>
<ul><li>Прочитайте вопрос и спросите, что именно спрашивают. Подчеркните ключевое слово вопроса.</li><li>В каждом варианте подчеркните отличающее слово и подумайте о синонимах, которые можете услышать.</li></ul>
<h3>Во время записи</h3>
<ul><li>Услышав вариант в первый раз, не пишите ответ. Поставьте маленькую пометку и слушайте дальше.</li><li>But и however сигнализируют поворот мысли.</li><li>Выбирайте только после полного обсуждения.</li></ul>
${fx('Услышали «I thought the lab would be best…» и выбрали это','Подождали продолжение: «…but the library turned out to be quieter»','Первый вариант часто дистрактор. Ответ подтверждается после слова but.')}`},
{id:'ls5',title:'Карты: идём по маршруту вместе с говорящим',tag:'ls',min:9,cat:'lsq',html:`
<p>Карта кажется сложной, потому что нужно слушать, читать, следить за направлениями и писать одновременно. Система делает её предсказуемой.</p>
<h3>Язык направлений: знать автоматически</h3>
<ul><li>at the top / at the bottom, on the left / on the right, on the far side.</li><li>to the north / to the west, slightly west of, in the southwest / in the northeast.</li><li>in the middle of / in the centre of, above / below, inside / outside.</li><li>opposite / in front of, left-hand side / right-hand side, clockwise / anticlockwise.</li><li>a little beyond, just past, before you get to, adjoining, enter via, runs alongside.</li></ul>
<h3>До записи (30 секунд)</h3>
<ul><li>Изучите карту, найдите главные ориентиры.</li><li>Подумайте, откуда говорящий начнёт, что нужно подписать и какие слова вы услышите.</li></ul>
<h3>Во время записи</h3>
<ul><li>Внимательно слушайте начало: оно задаёт точку отсчёта.</li><li>Представьте себя там, где стоит говорящий: что слева, справа, впереди. Не смотрите на карту сверху, идите по маршруту.</li><li>Следите за словами-ориентирами: Next, we’ll move to… Записывайте кратко, орфографию доведите позже.</li><li>Дистрактор: «This used to be the library, but we moved it» — верно новое расположение.</li></ul>
${co('','Совет','Тренируйтесь на официальных тестах: так вы привыкнете к реальному темпу и интонации IELTS, а случайные онлайн-викторины этого не дают.')}`},
{id:'sp7',title:'Part 3 в 8.5: «чемпионские» темы и steering',tag:'sp',min:10,cat:'spq',html:`
<p>Застрять на 7.5 можно годами при хорошем английском. Причина обычно в подходе: вы воспринимаете Part 3 как экзамен по знаниям, а нужно показать, как вы развиваете сложные мысли.</p>
<h3>Что хочет экзаменатор</h3>
<ul><li>Не широту, а глубину: одна мысль, объяснённая как следует.</li><li>Ясное объяснение, почему это важно.</li><li>Сравнение и размышление, а не список проблем.</li></ul>
<h3>Чемпионские темы</h3>
<ul><li>Найдите 3–5 тем, о которых можете говорить естественно и долго: профессия, хобби, спорт, путешествия.</li><li>Подготовьте для каждой два разных аспекта, конкретные примеры и причину личного интереса.</li><li>Тренируйтесь соединять случайные вопросы Part 3 с этими темами.</li></ul>
<h3>Техника steering</h3>
<ul><li>Фразы-переходы: Speaking from my experience in…, What I’ve noticed in my field is…, From my perspective as someone interested in…, I can give you an example from…</li><li>Если связь натянута, не форсируйте: коротко ответьте честно на общую тему, затем «but what I know more about is…» и развивайте свою область.</li><li>Не притворяйтесь экспертом во всём: используйте реальный опыт.</li></ul>
${fx('What skills will be valuable in the future? — Communication, leadership, teamwork, creativity, problem-solving…','I think communication will matter most, because workplaces are becoming more international. People who explain their ideas clearly to colleagues from other countries get more done. In my own team, the most valued person isn’t the most technical one, but the one who makes complex issues simple.','Одна идея, объяснение и пример вместо списка.')}`},
{id:'sp8',title:'Part 3: развитие ответа и сильная подача',tag:'sp',min:9,cat:'spq',html:`
<p>Part 1 любит быстрые естественные ответы. Part 3 задаёт вопросы, над которыми нужно подумать: выберите угол и развивайте его, иначе придётся быстро замолчать.</p>
<h3>Формула развития</h3>
<ul><li>Мысль: 10–15 секунд.</li><li>Объяснение «почему / как»: 30–45 секунд.</li><li>Конкретный пример: 30–45 секунд.</li><li>Короткий возврат к мысли.</li></ul>
<h3>Why / How / Example</h3>
<ul><li>Why: почему это важно, что будет без этого.</li><li>How: как это работает, какой процесс.</li><li>Example: конкретная ситуация, а не «at work you need to communicate».</li></ul>
<h3>Контраст вместо повтора</h3>
<ul><li>Структура: «You can look at it two ways. On one hand… On the other hand…»</li><li>Или: «It depends. In situation A… but in situation B…»</li><li>Два контрастных примера показывают глубину мысли, три похожих звучат бедно.</li></ul>
<h3>Подача</h3>
<ul><li>Техника задней стены: выберите точку на дальней стене и говорите так, чтобы вас слышали там. Громкость важнее акцента.</li><li>Выделяйте ключевые слова, делайте паузу перед важной мыслью, быстрее говорите примеры и медленнее основную мысль.</li><li>Упражнения: счёт от 1 до 10 с нарастающей громкостью, запись с разного расстояния, один текст с разными акцентами.</li></ul>
${co('','Неделя 1','Пн–вт: подготовьте три чемпионские темы. Ср–чт: двух-примерная техника на любые вопросы. Пт: попросите кого-нибудь задавать случайные вопросы Part 3 и тренируйте переходы.')}`}
);

const T8={w:[['Считайте вопросы в задании','Отметьте в плане каждый вопрос и каждую инструкцию. Если вопроса два, вам нужны два ответа с развитием: пропуск ограничивает Task Response.'],['Сверяйте абзац с введением','Каждая тема абзаца парафразирует идею из введения. Если абзац начинает доказывать другое, переписывайте его или введение.'],['«So what?» дважды','После темы спросите себя «и что из этого?» минимум два раза. Это превращает идею из band 6 в развитую идею band 7–8.'],['Не перегружайте связками','Хватает одной связки в начале абзаца и пары внутри. Связки в каждом предложении снижают оценку.'],['Смягчайте утверждения','Заменяйте «always» и «never» на «often», «tends to», «can». Точность звучит взрослее и безопаснее.'],['Номинализация','Один-два раза за эссе: «The rise in unemployment leads to…» вместо «When unemployment rises, …». Это добавляет диапазон без риска.'],['Task 1: сравнивайте, не перечисляйте','Каждое предложение сравнивает минимум две величины или показывает тренд. Не перечисляйте все цифры подряд.'],['Task 1: overview пишите сразу','Напишите overview сразу после введения, пока данные свежи. 2–3 общих признака без цифр.'],['Примеры без выдумки цифр','Без «82% по данным исследования». Конкретный правдоподобный пример лучше выдуманной статистики.'],['Личный список ошибок','Выпишите 3 ваших самых частых ошибки (артикли, число, времена) и на последних трёх минутах проверяйте только их.'],['Не заучивайте шаблоны целиком','Одинаковые длинные формулы в каждом эссе заметны. Учите приёмы, а не абзацы.']],
r:[['Подчеркните усилители в утверждении','Слова some, most, only, usually, all меняют ответ True на False. Найдите их в тексте отдельно.'],['Тест на False против NG','Можете показать предложение, которое противоречит? Если нет, это Not Given, а не False.'],['Matching Headings: найдите темы абзацев','Отметьте главную мысль каждого абзаца. Заголовки только про деталь или про другой абзац отбрасывайте.'],['Предскажите грамматику пропуска','Существительное, глагол, прилагательное, единственное или множественное число. Это сужает поиск до пары слов.'],['MCQ: ответ до вариантов','Прочитайте стержень вопроса и предскажите ответ, потом смотрите варианты. Крайности (always, completely) обычно ошибочны.'],['Ищите якоря','Имена, числа, даты и заглавные слова находятся быстрее всего. Отталкивайтесь от них, потом читайте вокруг.'],['Не оставляйте пустых ответов','За неверный ответ баллы не снимают. После двух минут без результата угадайте и идите дальше.'],['Третий текст: карта аргумента','Прочитайте первое предложение каждого абзаца (30–40 секунд), чтобы увидеть структуру, и только потом решайте вопросы.'],['Копируйте слова точно','Орфография, множественное число и дефисы берутся из текста. Сверьтесь перед записью в бланк.'],['Парные синонимы','Записывайте 5 пар парафраза в день (rise / climb). За месяц вы узнаете большинство замен.'],['Yes/No/NG: слова мнения','Arguably, it seems, regrettably показывают позицию автора. Факты и мнения различайте.']],
l:[['Предскажите тип ответа','До записи определите: число, имя, место, прилагательное; единственное или множественное. Так вы поймаете ответ вовремя.'],['Тренируйте числа и телефоны','Double nine, oh = 0, fifteen и fifty. Диктуйте себе телефоны и даты, это самый частый источник потерь.'],['Путаница букв при диктовке','A/E/I, G/J, B/P, M/N. Произносите вслух и записывайте, как диктуют имена по буквам.'],['Part 3: пометьте говорящих','Присвойте каждому говорящему букву и отмечайте, чьё мнение вы слышите. Вопросы часто спрашивают про одного из них.'],['Потеряли ответ: отпустите','Если пропустили вопрос, сразу переключайтесь на следующий. Один потерянный ответ не должен стоить трёх.'],['Part 4: слушайте переходы','Moving on, another factor, finally. Они показывают смену пункта лекции: заголовки заметок подскажут, где вы.'],['Дистрактор «было, но стало»','Originally… but… in the end. Ответ после изменения, а не до него.'],['Окончания -s и -ed','В слитной речи их почти не слышно. Предсказывайте по грамматике: many, a, was, has been.'],['Тренируйтесь на 1.25x','Вернувшись к обычной скорости, вы почувствуете, что запись «замедлилась». Добавьте разные акценты.'],['Пишите кратко, исправляйте позже','Пометку ставьте сразу, орфографию дорабатывайте в паузе. На карте записывайте только слово ориентира.'],['Проверка орфографии в конце','Вычитайте число, окончания и соответствие лимиту слов. Это самые частые мелкие потери.']],
s:[['Ответ в первых двух предложениях','Первое предложение отвечает на заданный вопрос, затем причина и пример. Не начинайте с предыстории.'],['Part 1: 2–3 предложения','Не одно слово и не монолог: прямой ответ, причина, короткий пример.'],['Part 2: ответ на карточку за 30 секунд','Скажите, что вы описываете, затем детали. Пункты карточки подсказки, не жёсткий план.'],['Part 3: позиция за 20 секунд','Займите позицию сразу, затем причина и пример, потом другая точка зрения или вывод.'],['Три-пять чемпионских тем','Подготовьте для каждой два аспекта и примеры. Это решает Part 3, где паузы убивают беглость.'],['Два контрастных примера','Вместо трёх похожих. Контраст показывает глубину мысли.'],['Время рассказа в Part 2','Следите за временем: прошлое, настоящее, would. Не прыгайте между ними без причины.'],['Одно сложное предложение в ответе','Although, who/which, if…would. Естественно и точно, без демонстрации ради демонстрации.'],['Ударение в предложении','Выделяйте ключевые слова, служебные слабее. Говорите смысловыми кусками с паузами между ними.'],['Громче и чётче','Техника задней стены: говорите так, чтобы слышали в дальнем конце комнаты. Тихая речь снижает оценку за чёткость.'],['Исправляйте оговорки быстро','Заметили ошибку? Короткое «sorry, I mean…» и верная фраза. Это показывает контроль грамматики.'],['Запишите себя и расшифруйте','Выпишите свой ответ на бумагу. Найдёте три повторяющиеся ошибки и слова-паразиты. Это точнее любых советов.']]};

 {id:'w-band9',title:'Writing: точность и развитие до band 8–9',tag:'gen',min:18,cat:'wb8',html:`<p>Высокий балл не достигается набором «умных» слов. Экзаменатор оценивает, насколько точно вы ответили на задание, логично развили идеи, подобрали лексику и контролировали грамматику.</p><h3>Task 2: проверка содержания</h3><ul><li>Определите все части вопроса и ответьте на каждую.</li><li>Сформулируйте ясную позицию и сохраняйте её на протяжении эссе.</li><li>Каждый основной тезис объясните причинно-следственной связью и конкретным примером.</li><li>Не добавляйте примеры, которые не доказывают тезис.</li></ul><h3>Task 1 Academic</h3><ul><li>Выберите главные тенденции, различия или этапы.</li><li>Дайте точный overview, затем сравните релевантные данные.</li><li>Не придумывайте причины, которых нет в диаграмме.</li></ul><h3>Редактирование</h3><p>Проверьте смысл, согласование, артикли, предлоги, формы слов, пунктуацию и повторы. Сложное предложение полезно только тогда, когда оно грамматически контролируется.</p>`},

/* ===== PRACTICE ===== */
function startQuiz(cat){
  let ids=[];
  if(cat==='mist')ids=Object.keys(S.mist).filter(id=>{const[c,i]=id.split(':');return QB[c]&&QB[c][+i]});
  else if(cat==='mix'){const all=[];CATS.forEach(c=>QB[c.id].forEach((_,i)=>all.push(c.id+':'+i)));ids=shuffle(all).slice(0,15)}
  else ids=shuffle(QB[cat].map((_,i)=>cat+':'+i));
  if(!ids.length){toast('Здесь пока нет вопросов');return}
  const items=ids.map(id=>{const[c,i]=id.split(':'),q=QB[c][+i];return{id,cat:c,q:q[0],opts:shuffle(q[1].map((t,k)=>({t,ok:k===q[2]}))),why:q[3],aud:q[4]}});
  ui.Q={cat,items,i:0,sel:null,score:0,wrong:[]};
  go('practice');
}
function pick(k){
  const Q=ui.Q;if(!Q||Q.sel!==null)return;const it=Q.items[Q.i];if(!it.opts[k])return;
  Q.sel=k;const ok=it.opts[k].ok,st=S.stats[it.cat]||(S.stats[it.cat]={a:0,c:0});
  st.a++;if(ok){st.c++;Q.score++;delete S.mist[it.id]}else{S.mist[it.id]=1;Q.wrong.push(it)}
  touch();save();render();
}
function vPractice(){
  const Q=ui.Q;
  if(Q&&Q.i>=Q.items.length){
    const n=Q.items.length,p=Math.round(Q.score/n*100);
    return `<div class="qwrap"><div class="qbox stack" style="text-align:center;align-items:center"><span class="eyebrow">Результат</span><div class="score">${Q.score}<span class="muted" style="font-size:32px">/${n}</span></div><p class="lead">${p>=80?'Отлично. Тема освоена.':p>=60?'Хорошо. Разберите ошибки ниже и повторите.':'Нужна практика. Перечитайте урок и повторите вопросы.'}</p>
     <div class="cta"><button class="btn primary" data-act="quiz-start" data-cat="${Q.cat}">Ещё раз</button><button class="btn" data-act="quiz-exit">К темам</button></div></div>
     ${Q.wrong.length?`<div class="stack"><h2 class="h2">Разбор ошибок</h2>${Q.wrong.map(w=>`<div class="card stack"><span class="tag ${(CATS.find(c=>c.id===w.cat)||{}).tag||'gen'}" style="align-self:flex-start">${esc(catName(w.cat))}</span><div style="font:500 17px/1.45 var(--font-read)">${esc(w.q)}</div><div class="why ok"><b>Верно</b>${esc(w.opts.find(o=>o.ok).t)}<br><span class="muted">${esc(w.why)}</span></div></div>`).join('')}</div>`:''}</div>`;
  }
  if(Q){
    const it=Q.items[Q.i],ans=Q.sel!==null,ok=ans&&it.opts[Q.sel].ok,c=CATS.find(x=>x.id===it.cat)||{tag:'gen',name:it.cat};
    return `<div class="qwrap"><div class="row between"><button class="btn ghost sm" data-act="quiz-exit">Выйти</button><span class="mono muted sm">${Q.i+1} / ${Q.items.length}</span></div>
     <div class="bar"><i style="width:${(Q.i+(ans?1:0))/Q.items.length*100}%"></i></div>
     <div class="qbox"><span class="tag ${c.tag}">${esc(c.name)}</span><div class="qtext">${esc(it.q)}</div>${it.aud?`<div style="margin:10px 0"><button class="btn primary sm" data-act="say">▶ Прослушать</button></div>`:''}
      <div class="opts">${it.opts.map((o,k)=>`<button class="opt ${ans?'lock '+(o.ok?'ok':(k===Q.sel?'no':'')):''}" data-act="pick" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(o.t)}</span></button>`).join('')}</div>
      ${ans?`<div class="why ${ok?'ok':'no'}"><b>${ok?'Верно':'Не совсем'}</b>${esc(it.why)}</div><div class="cta"><button class="btn primary" data-act="quiz-next">${Q.i+1<Q.items.length?'Дальше':'Показать результат'}</button><span class="muted xs" style="align-self:center">Enter</span></div>`:''}
     </div></div>`;
  }
  const nm=Object.keys(S.mist).length,tot=Object.values(QB).reduce((a,b)=>a+b.length,0);
  return head('Тренажёр','Упражнения с разбором',`${tot} вопросов по ${CATS.length} темам. Каждый ответ сразу объясняется. Ошибки сохраняются, и их можно повторить отдельно.`)+
   `<div class="row"><button class="btn primary" data-act="quiz-start" data-cat="mix">Микс · 15 вопросов</button><button class="btn" data-act="quiz-start" data-cat="mist" ${nm?'':'disabled'}>Мои ошибки${nm?` · ${nm}`:''}</button></div>
   <div class="grid gauto" style="margin-top:18px">${CATS.map(c=>{const s=S.stats[c.id],p=s&&s.a?Math.round(s.c/s.a*100):null;return `<button class="cat" data-act="quiz-start" data-cat="${c.id}"><span class="tag ${c.tag}" style="align-self:flex-start">${c.tag.toUpperCase()}</span><b style="font:650 15.5px/1.25 var(--font-display)">${c.name}</b><span class="muted sm">${c.desc}</span><div class="bar ${p===null?'':p>=80?'good':p>=60?'warn':'bad'}"><i style="width:${p||0}%"></i></div><div class="row between xs muted"><span>${QB[c.id].length} вопросов</span><span class="mono">${p===null?'не начато':p+'%'}</span></div></button>`}).join('')}</div>`;
}

function row(l,v,c){return `<div class="mrow"><span>${l}</span><span class="v ${c||''}">${v}</span></div>`}
function panelHTML(a,kind){

  if(kind==='t2'){h+=row('Абзацев (цель 4)',a.paras.length,a.paras.length===4?'ok':'low')+row('Введение / заключение (слов)',a.intro+' / '+a.concl,a.intro>=30&&a.intro<=55&&a.concl>=30&&a.concl<=55?'ok':'low')}
  else h+=row('Абзацев (цель 4)',a.paras.length,a.paras.length===4?'ok':'low');
  h+=row('Среднее предложение',a.avgLen+' сл.',a.avgLen>=12&&a.avgLen<=26?'ok':'low')+`</div>`;

    h+=`<div class="card"><h3 class="h3">Структуры</h3><p class="muted xs" style="margin-bottom:6px">Это только счётчик, а не цель. Экзаменатор структуры не считает: он оценивает точность и разнообразие. Не вставляйте структуру ради галочки.</p>${S2.map(s=>row(s[0],s[1]+'  (ориентир '+s[3]+')','')).join('')}${row('Осторожные слова (can, may, often)',a.hedge,'')}</div>`;
  }else{
    h+=`<div class="card"><h3 class="h3">Task 1</h3>${row('Overview (Overall…)',a.hasOverview?'есть':'нет',a.hasOverview?'ok':'bad')}${row('Чисел в тексте',a.nums,a.nums>=6?'ok':'low')}${row('Глаголы трендов',a.trend,a.trend>=4?'ok':'low')}${row('Сравнения',a.cmp,a.cmp>=2?'ok':'low')}${row('Личное мнение',a.opinion?'есть':'нет',a.opinion?'bad':'ok')}</div>`;
  }

  if(a.repeats.length)h+=`<div class="card"><h3 class="h3" style="margin-bottom:6px">Повторы слов</h3>${a.repeats.map(([x,n])=>row(x,'×'+n,'low')).join('')}<p class="muted xs" style="margin-top:6px">Замените синонимами (раздел «Словарь → Замены»).</p></div>`;

function updatePanel(kind){

function updateTimer(kind){
  const tm=TM[kind],c=WC[kind],t=$('#tm-t');if(!t)return;
  t.textContent=fmtT(tm.left);
  const b=$('#tm-b');if(b)b.textContent=tm.run?'Пауза':tm.left<tm.total?(tm.left?'Продолжить':'Старт'):'Старт';
  const el=tm.total-tm.left;let start=0,cur=-1;
  $$('.phases i b').forEach((bar,i)=>{const d=c.ph[i]*60;bar.style.width=Math.max(0,Math.min(1,(el-start)/d))*100+'%';if(el>=start&&el<start+d)cur=i;start+=d});
  if(el>=tm.total)cur=c.ph.length-1;
  $$('#tm-lbl span').forEach((s,i)=>s.classList.toggle('on',i===cur&&(tm.run||el>0)));
  const ph=$('#tm-ph');if(ph)ph.textContent=tm.left===0?'Время вышло':cur>=0&&(tm.run||el>0)?'Сейчас: '+c.phl[cur]:'';

function tmToggle(kind){

  if(tm.run){tm.left=Math.max(0,Math.round((tm.end-Date.now())/1000));tm.run=false}
  else{tm.end=Date.now()+tm.left*1000;tm.run=true;const ta=$('#ta');ta&&ta.focus()}
  updateTimer(kind);
}

function calcOverall(){const v=['tr','cc','lr','gra'].map(k=>+($('#sc-'+k)||{value:0}).value);const o=$('#sc-all');if(o&&v.every(Boolean))o.textContent=ieltsRound(v.reduce((a,b)=>a+b,0)/4).toFixed(1)}
function saveEssay(kind,pid){
  const ta=$('#ta');if(!ta)return;const w=wordsOf(ta.value);

  const sc={};['tr','cc','lr','gra'].forEach(k=>sc[k]=+$('#sc-'+k).value);

/* ===== VOCAB ===== */
function vocList(){
  const q=ui.vq.trim().toLowerCase();let items=[];
  (ui.vtopic==='all'?VT.map(x=>x[0]):[ui.vtopic]).forEach(t=>VOC[t].forEach(x=>items.push(x)));
  if(q)items=items.filter(x=>(x[0]+' '+x[1]+' '+x[2]).toLowerCase().includes(q));
  return items.length?items.map(x=>{const k=!!S.known[x[0]];return `<div class="vcard ${k?'known':''}"><div class="row between" style="flex-wrap:nowrap"><b>${esc(x[0])}</b><button class="chip ${k?'on':''}" data-act="known" data-p="${esc(x[0])}">${k?'знаю':'выучить'}</button></div><span class="muted sm">${esc(x[1])}</span><span style="font-family:var(--font-read);font-size:15.5px">${esc(x[2])}</span></div>`}).join(''):'<p class="muted">Ничего не найдено.</p>';
}
function buildDeck(){
  const arr=[];(ui.vtopic==='all'?VT.map(x=>x[0]):[ui.vtopic]).forEach(t=>VOC[t].forEach(x=>{if(!ui.fcOnly||!S.known[x[0]])arr.push(x)}));
  ui.fc={deck:shuffle(arr),i:0,flip:false};
}
function vVocab(){
  const tabs=[['col','Collocations'],['fc','Флэшкарты'],['link','Связки'],['rep','Замены и ошибки']];
  const known=Object.keys(S.known).length;
  let body='';
  const topics=`<div class="row" style="margin:14px 0"><button class="chip ${ui.vtopic==='all'?'on':''}" data-act="v-topic" data-v="all">Все</button>${VT.map(t=>`<button class="chip ${ui.vtopic===t[0]?'on':''}" data-act="v-topic" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if(ui.vtab==='col')body=topics+`<div class="row" style="margin-bottom:14px"><input type="search" id="v-q" value="${esc(ui.vq)}" placeholder="Поиск по сочетаниям и переводу" style="max-width:360px" aria-label="Поиск"><span class="muted sm">Выучено: ${known}</span></div><div class="grid gauto" id="vlist">${vocList()}</div>`;
  if(ui.vtab==='fc'){
    if(!ui.fc)buildDeck();const f=ui.fc,c=f.deck[f.i];
    body=topics+`<div class="row" style="margin-bottom:14px"><label class="check" style="padding:0"><input type="checkbox" id="fc-only" ${ui.fcOnly?'checked':''}><span>Только невыученные</span></label></div>`+
    (c?`<div class="flash stack"><div class="row between"><span class="mono muted sm">${f.i+1} / ${f.deck.length}</span><span class="muted sm">Нажмите на карточку, чтобы перевернуть</span></div>
     <div class="fcard" data-act="fc-flip" role="button" tabindex="0" aria-label="Перевернуть карточку">${f.flip?`<span class="eyebrow">перевод</span><div class="big">${esc(c[1])}</div><p style="font-family:var(--font-read);font-size:17px">${esc(c[2])}</p>`:`<span class="eyebrow">collocation</span><div class="big">${esc(c[0])}</div><span class="muted sm">Вспомните значение и придумайте своё предложение</span>`}</div>
     <div class="row" style="justify-content:center"><button class="btn" data-act="fc-again">Ещё раз</button><button class="btn primary" data-act="fc-know">Знаю</button></div></div>`
     :`<div class="card stack" style="text-align:center;align-items:center"><h3 class="h3">Колода закончилась</h3><p class="muted">Все карточки в этой теме пройдены.</p><button class="btn primary" data-act="fc-restart">Начать заново</button></div>`);
  }
  if(ui.vtab==='link')body=`<div class="stack" style="margin-top:14px"><p class="muted">Связка должна соответствовать функции. Одна и та же связка не больше двух раз за эссе.</p>${tb(['Функция','Связки','Пример'],LINK)}</div>`;
  if(ui.vtab==='rep')body=`<div class="stack" style="margin-top:14px"><h3 class="h3">Чем заменять слова-повторы</h3><p class="muted">Меняйте слово, когда оно встречается больше двух раз, и проверяйте, что замена подходит по смыслу.</p>${tb(['Вы используете','Замена'],REPL)}<h3 class="h3" style="margin-top:10px">Неестественные сочетания</h3>${tb(['Вы написали','Как лучше'],UNNAT)}<h3 class="h3" style="margin-top:10px">Чего избегать</h3><div class="grid g2"><div class="fix"><div><span class="lbl b">нельзя</span><span class="x">kids, gonna, lots of, don’t</span></div><div><span class="lbl g">можно</span><span class="v">children, going to, many, do not</span></div></div><div class="fix"><div><span class="lbl b">нельзя</span><span class="x">very important, really good, a lot</span></div><div><span class="lbl g">можно</span><span class="v">key, advantageous, a great deal of</span></div></div></div></div>`;
  return head('Словарь','Collocations, связки, замены','Учите сочетания целиком и сразу придумывайте своё предложение. Знакомые карточки можно отмечать как выученные.')+

const Snd=(function(){

 const outLevel=()=>(muted&&!intro)?0:.7;

 function unlock(){if(!build())return;if(ctx.state!=='running')ctx.resume().then(()=>{label()}).catch(()=>{});label()}

 function tone(f,type,t0,dur,g,dest,att,rel,det){const o=ctx.createOscillator(),e=ctx.createGain();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;e.gain.setValueAtTime(0,t0);e.gain.linearRampToValueAtTime(g,t0+att);e.gain.setTargetAtTime(0,t0+Math.max(att,dur-rel),rel/3);o.connect(e);e.connect(dest);o.start(t0);o.stop(t0+dur+rel*2.4);return o}

 /* значение автоматизации с учётом того, что музыка могла включиться не с нуля (e — секунд прошло) */

 function playIntro(e){if(!ctx||ctx.state!=='running'||introPlayed||!intro)return;introPlayed=true;const now=N()+.05,bus=ctx.createGain();bus.gain.value=1;bus.connect(out);bus.connect(verb);introBus=bus;

 function whoosh(d,up,soft){if(!ctx||ctx.state!=='running')return;const k=soft?.6:1,t=N()+.02;

 if(!to){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
 N={stops,t0:performance.now(),dur,tv,o,to,from:stops[0],hid:!stops[0],shown:false};Snd.whoosh(dur/1000,!!to);gxB.classList.add('gx-leave')}
function flySub(p,v,o){if(N||INTRO)return;saveDraft();if(matchMedia('(prefers-reduced-motion:reduce)').matches){showView(p,v,o);return}Snd.whoosh(3.6,true,true);N={stops:[p],sub:{p,v},t0:performance.now(),dur:3600,tv:v,o,to:p,from:p,hid:false,shown:false};gxB.classList.add('gx-leave')}

 let tourIndex=0,tourAudio=null,tourActive=false,tourToken=0,tourStarted=0,tourClockTimer=null;
 function tourMusic(on){
  try{if(!on){if(tourAudio){tourAudio.osc.forEach(o=>{try{o.stop()}catch(e){}});tourAudio.ctx.close();tourAudio=null}return}
   if(tourAudio)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
   const ctx=new C(),master=ctx.createGain();master.gain.value=.018;master.connect(ctx.destination);const osc=[];
   [[55,'sine',.28],[82.41,'sine',.12],[110,'triangle',.06],[164.81,'sine',.025]].forEach(([f,t,v])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(master);o.start();osc.push(o)});
   tourAudio={ctx,osc};
  }catch(e){}
 }
 function tourNarration(){
  const [id,title,desc]=TOUR[tourIndex],p=PL.find(x=>x.id===id);
  return {p,title,desc};
 }
 function tourSpeakSatellites(p,token,index,done){
  if(token!==tourToken||!tourActive)return;
  if(index>=p.v.length){TOURSAT=null;document.body.classList.remove('tour-speaking');document.querySelectorAll('.tour-focus').forEach(e=>e.classList.remove('tour-focus'));done();return}
  const v=p.v[index],label=(VIEWS.find(x=>x[0]===v)||[v,v])[1],detail=SAT_DESC[v]||('Раздел '+label+': здесь собраны соответствующие материалы и инструменты подготовки.');
  TOURSAT=v;document.body.classList.remove('tour-speaking');document.querySelectorAll('.gx-hot,.gx-sat-label').forEach(e=>e.classList.remove('tour-focus'));
  tourFlyToSatellite(p,v,1500,()=>{if(token!==tourToken||!tourActive)return;document.body.classList.add('tour-speaking');const satLabel=satLabels[p.id+'|'+v];if(satLabel)satLabel.classList.add('tour-focus');tourSpeak(`Спутник ${index+1}. ${label}. ${detail}`,token,()=>tourSpeakSatellites(p,token,index+1,done));});
 }
 function tourSpeak(txt,token,done){
  let finished=false;
  const finish=()=>{if(finished||token!==tourToken||!tourActive)return;finished=true;try{done()}catch(e){console.error('Tour continuation error',e);tourIndex++;setTimeout(tourPlanet,500)}};
  try{
   if(!('speechSynthesis'in window)){setTimeout(finish,Math.max(5000,txt.length*65));return}
   const chunks=txt.match(/[^.!?]+[.!?]*/g)||[txt];let i=0;
   const speakNext=()=>{
    if(token!==tourToken||!tourActive||finished)return;
    if(i>=chunks.length){finish();return}
    const part=chunks[i++].trim();if(!part){speakNext();return}
    const u=new SpeechSynthesisUtterance(part);u.lang='ru-RU';u.rate=.96;u.pitch=1.12;u.volume=1;
    const voices=(speechSynthesis.getVoices()||[]).filter(v=>/^ru([-_]|$)/i.test(v.lang));
    const best=voices.sort((a,b)=>{const score=v=>(/natural|натал/i.test(v.name)?100:0)+(/neural|online|premium|enhanced/i.test(v.name)?70:0)+(/google|microsoft/i.test(v.name)?35:0)+(v.localService?0:12);return score(b)-score(a)})[0];if(best)u.voice=best;
    let advanced=false;const advance=()=>{if(advanced||token!==tourToken||!tourActive||finished)return;advanced=true;clearTimeout(watchdog);setTimeout(speakNext,120)};
    const watchdog=setTimeout(advance,Math.max(9000,part.length*180));
    u.onend=advance;u.onerror=advance;
    try{speechSynthesis.speak(u)}catch(e){advance()}
   };
   speakNext();
  }catch(e){finish()}
 }
 function tourHoldCamera(T){
  if(!TOURHOLD)return camAt(cur,null,0,T);
  if(TOURHOLD.followSat){
   const h=TOURHOLD.followSat,P=pPos(h.p,T),S=satInfo(h.p,h.v,T).pos,dir=nm(v3.sub(S,P)),d=Math.max(h.p.r*3.1,8);
   return{pos:[S[0]+dir[0]*d,S[1]+dir[1]*d,S[2]+dir[2]*d],tgt:S,up:[0,1,0],q:.88};
  }
  return TOURHOLD.follow?planetNearCam(TOURHOLD.follow,T):TOURHOLD;
 }
 function tourFlyToSatellite(p,v,dur,done){
  document.body.classList.remove('tour-speaking');document.querySelectorAll('.tour-focus').forEach(e=>e.classList.remove('tour-focus'));
  const T=performance.now()/1000,P=pPos(p,T),from=tourHoldCamera(T);
  const startDir=nm(v3.sub(from.pos,P)),targetDir=nm(v3.sub(satInfo(p,v,T).pos,P)),to=satOrbitCam(p,startDir,targetDir,T,1,v);
  TOURCAM={from,to,target:p,targetSat:v,t0:performance.now(),dur:dur||1500,done};
 }
 function tourFlyTo(id,dur,done){
  if(N||INTRO)return;document.body.classList.remove('tour-speaking');document.querySelectorAll('.tour-focus').forEach(e=>e.classList.remove('tour-focus'));
  const T=performance.now()/1000,target=id?PL.find(x=>x.id===id):null;TOURFOCUS=target;
  const from=tourHoldCamera(T),to=target?planetNearCam(target,T):camAt(null,null,0,T);
  TOURCAM={from,to,target,t0:performance.now(),dur:dur||2600,done};
 }
 function tourPlanet(){
  if(!tourActive)return;
  if(tourIndex>=TOUR.length){endTour();return}
  const [id]=TOUR[tourIndex],p=PL.find(x=>x.id===id);if(p)document.documentElement.style.setProperty('--pa',p.c);
  const token=++tourToken;
  tourFlyTo(id,2700,()=>{
    if(!tourActive||token!==tourToken)return;
    const info=tourNarration();TOURSAT=null;document.body.classList.add('tour-speaking');document.querySelectorAll('.gx-hot,.gx-sat-label').forEach(e=>e.classList.remove('tour-focus'));if(hot[info.p.id])hot[info.p.id].classList.add('tour-focus');
    tourSpeak(`${info.title}. ${info.desc} У этой планеты ${info.p.v.length} ${info.p.v.length===1?'спутник':'спутников'}.`,token,()=>{
      if(!tourActive||token!==tourToken)return;
      tourSpeakSatellites(info.p,token,0,()=>{if(!tourActive||token!==tourToken)return;tourIndex++;setTimeout(tourPlanet,700)});
    });
  });
 }
 function startTour(){
  if(N||INTRO)return;
  try{speechSynthesis.cancel()}catch(e){}
  tourIndex=0;tourActive=true;tourToken++;tourStarted=performance.now();clearInterval(tourClockTimer);tourClockTimer=setInterval(()=>{if(!tourActive)return;const sec=Math.floor((performance.now()-tourStarted)/1000),el=document.getElementById('tour-clock');if(el)el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},250);TOURSAT=null;document.body.classList.remove('tour-speaking');document.querySelectorAll('.tour-focus').forEach(e=>e.classList.remove('tour-focus'));gxB.classList.add('gx-on','tour-running');TOURHOLD=camAt(null,null,0,performance.now()/1000);TOURCAM=null;
  try{localStorage.setItem('ieltsGalaxyTourSeen','1')}catch(e){}
  tourMusic(true);tourPlanet();
 }
 function endTour(){
  if(!tourActive)return;tourActive=false;tourToken++;
  try{speechSynthesis.cancel()}catch(e){}
  tourMusic(false);clearInterval(tourClockTimer);TOURSAT=null;document.body.classList.remove('tour-speaking');document.querySelectorAll('.tour-focus').forEach(e=>e.classList.remove('tour-focus'));tourFlyTo(null,2100,()=>{TOURHOLD=null;TOURFOCUS=null;gxB.classList.remove('tour-running')});
 }
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tourActive){e.preventDefault();endTour()}});

return{sync,hop,back,boot,startTour}})();
